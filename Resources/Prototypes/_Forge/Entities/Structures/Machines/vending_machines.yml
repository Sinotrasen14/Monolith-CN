- type: entity
  parent: [BaseStructureDisableAnchoring, VendingMachineCredit] # Mono - VendingMachineCredit
  id: VendingMachineFlatpackVendRadio
  name: 组装包自动售货机
  description: 太空人随身必备的科技装备。
  components:
  - type: VendingMachine
    pack: FlatpackVendRadioInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    ejectState: eject-unshaded
    denyState: deny-unshaded
    requiresCash: true
  #  - type: Advertise
  #    pack: FlatpackVendAds
  - type: Sprite
    sprite: _NF/Structures/Machines/VendingMachines/flatpackvend.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#4b93ad"
  - type: MarketModifier
    mod: 25
