- type: entity
  name: 矿石袋 丨 ore bag
  id: OreBag
  parent: BaseStorageItem
  description: 专为打捞专家和矿工设计的坚固背包，可承载大量矿石。系在腰带上时能使附近矿石磁化。 丨 A robust bag for salvage specialists and miners alike to carry large amounts of ore. Magnetises any nearby ores when attached to a belt.
  components:
  - type: MagnetPickup
    magnetEnabled: false # Frontier
    magnetCanBeEnabled: false # Frontier
    range: 1.5 # Mono
  - type: Sprite
    sprite: Objects/Specific/Mining/ore_bag.rsi
    # Frontier: layered sprite
    layers:
    - state: icon
    - state: icon-on
      visible: False
      map: [ "enum.ToggleableVisuals.Layer" ]
    # End Frontier
  - type: Clothing
    sprite: Objects/Specific/Mining/ore_bag.rsi
    quickEquip: false
    slots:
    - belt
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,11,5 # Mono.
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
        - ArtifactFragment
        - Ore
  - type: Dumpable
    multiplier: 0.15 # mono
  - type: NFOreBag # Frontier
  # Begin DeltaV Additions: toggle magnet from White Dream
  - type: ItemToggle
    soundActivate: &soundActivate
      collection: sparks
      params:
        variation: 0.25
    soundDeactivate: *soundActivate
    onUse: false
    onAltUse: true
    onActivate: false
  - type: ItemToggleExamine
    on: item-toggle-examine-magnet-on
    off: item-toggle-examine-magnet-off
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: True }
          False: { visible: False }
  # End DeltaV Additions
