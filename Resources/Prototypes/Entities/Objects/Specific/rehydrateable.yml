        solution: cube
  - type: Rehydratable
    catalyst: Blood # blood is fuel
    catalystMinimum: 10
    possibleSpawns:
    - MobAbomination

- type: entity
  parent: PlushieCarp
  id: DehydratedSpaceCarp
  name: 脱水太空鲤鱼 丨 dehydrated space carp
  description: 看起来像一条毛绒鲤鱼玩具，但只要加点水，它就会变成一条活生生的太空鲤鱼！ 丨 Looks like a plush toy carp, but just add water and it becomes a real-life space carp!
  components:
  - type: SolutionContainerManager
    solutions:
      plushie:
        maxVol: 11 # needs room for water
        reagents:
        - ReagentId: CarpoToxin #Frontier Nutriment<CarpoToxin
          Quantity: 10
  - type: RefillableSolution
    solution: plushie
  - type: Reactive
    reactions:
    - reagents: [Water]
      methods: [Touch, Ingestion, Injection]
      effects:
      - !type:AddToSolutionReaction
        solution: plushie
  - type: Rehydratable
    possibleSpawns:
    - MobCarp
  - type: CollisionWake
    enabled: false
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 15
        mask:
        - ItemMask
      rehydrate:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        hard: false
        layer:
        - LowImpassable
  # pet fish before rehydrating and he will be nice to you
  - type: FactionException
  - type: PettableFriend
    successString: petting-success-dehydrated-carp
    failureString: petting-failure-dehydrated-carp
  - type: EmitSoundOnUse
    handle: false
    sound:
      path: /Audio/Effects/bite.ogg
  - type: StaticPrice
    price: 220 # The same price as dead (-20)

