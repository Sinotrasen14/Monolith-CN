- type: entity
  parent: MonkeyCube
  id: AbominationCube
  name: 憎恨立方体 丨 abomination cube
  description: 只需加入鲜血！ 丨 Just add blood!
  components:
  - type: SolutionContainerManager
    solutions:
      cube:
        maxVol: 10 # needs room for more blood
        reagents:
        - ReagentId: Blood
          Quantity: 9
  - type: Reactive
    reactions:
    - reagents: [Blood]
      methods: [Touch, Ingestion, Injection]
      effects:
