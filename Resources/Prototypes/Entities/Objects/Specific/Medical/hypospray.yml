- type: entity
  name: 无针注射器 丨 hypospray
  parent: BaseItem
  description: 基础型，无限制使用的气动皮下注射器。由纳米传讯顶尖科研团队设计，配备超大药剂储存仓，并具备近乎零延迟的注射特性。其侧面印有警示标识：“仅限医疗用途”。
  id: Hypospray
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    state: hypo
  - type: Item
    sprite: Objects/Specific/Medical/hypospray.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 30
  - type: RefillableSolution
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
  - type: Hypospray
    onlyAffectsMobs: false
  - type: UseDelay
    delay: 0.5
  - type: StaticPrice
    price: 1000
    vendPrice: 20000
  - type: StealTarget
    stealGroup:
    - Hypospray

