- type: entity
  parent: BaseItem
  id: ResearchDisk
  name: 研发点数盘（10000） 丨 research point disk (10000)
  description: 一张用于研发服务器的磁盘，内含10000点。 丨 A disk for the R&D server containing 10000 points.
  components:
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_pickup.ogg
      params:
        volume: -6
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_drop.ogg
      params:
        volume: -6
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_drop.ogg
      params:
        volume: -6
  # Goobstation edit end
  - type: Sprite
    sprite: Objects/Specific/Research/researchdisk.rsi
    state: icon
  - type: ResearchDisk
    points: 10000
  - type: GuideHelp
    guides:
    - Science
  - type: StaticPrice # Frontier
    price: 2000 # Mono
  - type: Tag #Mono: Exchangeable at commodity crate machine
    tags:
      - PointDisk

