- type: entity
  parent: DrinkBase
  id: FlaskBase
  abstract: true
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
  - type: Sprite
    state: icon
    sprite: Objects/Consumable/Drinks/flask.rsi
  - type: PhysicalComposition
    materialComposition:
      Steel: 300
  - type: FitsInDispenser
    solution: drink

- type: entity
  id: DrinkFlaskVisualsOpenable
  abstract: true
  components:
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "icon_open"}
          False: {state: "icon"}
  - type: Appearance
  - type: Sprite
    layers:
    - state: icon
      map: ["enum.OpenableVisuals.Layer"]
  - type: Openable
    sound:
      collection: flaskOpenSounds
    closeable: true
    closeSound:
      collection: flaskCloseSounds

# Flasks

- type: entity
  parent: [FlaskBase, DrinkFlaskVisualsOpenable]
  id: DrinkShinyFlask
  name: 闪亮的瓶子 丨 shiny flask
  description: 一个闪亮的金属瓶。上面似乎刻着一个希腊符号。 丨 A shiny metal flask. It appears to have a Greek symbol inscribed on it.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/shinyflask.rsi
  - type: Engraveable # Frontier

- type: entity
  parent: [FlaskBase, DrinkFlaskVisualsOpenable]
  id: DrinkMREFlask
  suffix: Full
  name: 军用即食口粮水壶 丨 MRE flask
  description: 一个古老的军用扁酒瓶，内盛为士兵们准备的上佳饮品。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/mreflask.rsi
  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: Water
          Quantity: 50
  - type: TrashOnSolutionEmpty
    solution: drink
  - type: StaticPrice
    price: 20 # Frontier: 12.5<20

