- type: entity
  parent: BaseItem
  id: DoorRemoteDefault
  name: 门远程装置 丨 door remote
  description: 一种可以远程开关和闩门的装置。 丨 A gadget which can open and bolt doors remotely.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Devices/door_remote.rsi
  - type: Item
    storedRotation: -90
  - type: Access
  - type: DoorRemote
  - type: StealTarget
    stealGroup: DoorRemote

- type: entity
  parent: DoorRemoteDefault
  id: DoorRemoteCommand
  name: 车门遥控器 丨 command door remote
  components:
  - type: Sprite
    layers:
    - state: door_remotebase
    - state: door_remotelightscolour
      color: "#e6e600"
    - state: door_remotescreencolour
      color: "#9f9f00"
  - type: Access
    groups:
    - Command

