- type: entity
  name: 基础轻机枪 丨 BaseWeaponLightMachineGun
  parent: BaseItem
  id: BaseWeaponLightMachineGun
  description: 一把突突突的突突枪。 丨 A rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
  - type: Item
    size: Huge
    shape:
    - 0,0,4,2 # Mono
  - type: Clothing
    sprite: Objects/Weapons/Guns/LMGs/l6.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus # Mono
    minAngle: -24
    maxAngle: -20
  - type: Gun # L6 LMG stats adjusted
    minAngle: 24
    maxAngle: 45
    angleIncrease: 2 # Mono
    angleDecay: 20
    fireRate: 8.5 # Mono
    projectileSpeed: 60 # Mono
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/lmg_cock.ogg
  - type: AmmoCounter
  - type: ItemSlots
    slots:
      gun_magazine:
        name: 弹匣 丨 Magazine
        startingItem: Magazine762x39mmBox
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine762x39mmBox
      gun_chamber:
        name: 腔室 丨 Chamber
        startingItem: Cartridge762x39mmFMJ
        priority: 1
        whitelist:
          tags:
            - Cartridge762x39mmFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 500
  - type: UseDelay
    delay: 1
  - type: ItemTax # Mono
    taxAccounts:
      nfsd: 0.2
  - type: SpeedModifiedOnWield # Mono
    walkModifier: 0.9
    sprintModifier: 0.75
  - type: GunRequiresWield # Mono
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/lmg_mouse.rsi
      state: all
  - type: WieldDelay # Mono
    baseDelay: 1
    modifiedDelay: 1
    preventFiring: true
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      collection: RiflesPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: RiflesDrop
  - type: EmitSoundOnLand
    sound:
      collection: RiflesDrop
  # Goobstation edit end
  # Mono - Gun stock attack
  - type: MeleeRequiresWield
  - type: MeleeWeapon
    attackRate: 0.7
    damage:
      types:
        Blunt: 15
    angle: 0
    wideAnimationRotation: 135
    animation: WeaponArcThrust
    soundHit:
      collection: MetalThud
  - type: AltFireMelee
    attackType: Light
  # Mono end

- type: entity
  name: PA L6B班用自动武器（7.62x39mm 口径） 丨 PA L6B SAW (7.62x39mm)
  id: WeaponLightMachineGunL6
  parent: [BaseWeaponLightMachineGun, BaseFactionGearPDVT3]
  description: 一把制作相当传统的轻机枪，配有漆面悦目的木质握把。使用7.62x39mm 弹药。现已停产，成为大断裂时期人类贪婪与野心的遗物。
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/LMGs/l6.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-3
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true
  - type: Appearance
  - type: Gun # Mono change - Sound for L6 saw
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/l6_fire.ogg

- type: entity
  name: PA L6C 行伍（7.62x39mm） 丨 PA L6C ROW (7.62x39mm)
  id: WeaponLightMachineGunL6C
  parent: BaseItem
  description: 一款供生化人使用的L6班用自动武器。通过内置的弹药制造器实时生成7.62x39mm 弹药，该制造器可缓慢自动充能。
  components:
    - type: Gun # Gun stats adjusted to be similar to LMG
      minAngle: 4
      maxAngle: 20
      angleIncrease: 3
      angleDecay: 20
      fireRate: 8
      projectileSpeed: 55 # Mono
      selectedMode: FullAuto
      availableModes:
        - FullAuto
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
      soundEmpty:
        path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
    - type: Sprite
      sprite: Objects/Weapons/Guns/LMGs/l6.rsi
      layers:
        - state: base
          map: [ "enum.GunVisualLayers.Base" ]
        - state: mag-3
          map: [ "enum.GunVisualLayers.Mag" ]
    - type: Item
      size: Huge
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
    - type: ProjectileBatteryAmmoProvider
      proto: Cartridge762x39mmFMJ
      fireCost: 100
    - type: Battery
      maxCharge: 10000
      startingCharge: 10000
    - type: BatterySelfRecharger
      autoRecharge: true
      autoRechargeRate: 25
    - type: AmmoCounter
