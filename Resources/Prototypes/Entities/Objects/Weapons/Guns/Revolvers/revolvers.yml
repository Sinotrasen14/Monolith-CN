- type: entity
  name: 基础武器左轮手枪 丨 BaseWeaponRevolver
  parent: BaseItem
  id: BaseWeaponRevolver
  description: 一把根深蒂固指哪打哪的射击利器。 丨 A rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
    state: icon
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Tag
    tags:
    - Sidearm
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/deckard.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: AmmoCounter
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 1.5
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
    projectileSpeed: 45 # Mono
  - type: UseDelay
    delay: 0.66
  - type: ContainerContainer
    containers:
      revolver-ammo: !type:Container
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - Cartridge357_magnumFMJ
        - SpeedLoader357_magnumFMJ
    mayTransfer: true # Frontier
    proto: Cartridge357_magnumFMJ
    capacity: 6
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]
    soundEject:
      path: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg
  - type: StaticPrice
    price: 50
  - type: ItemTax # Mono
    taxAccounts:
      nfsd: 0.2
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/pistol_mouse.rsi
      state: all
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      collection: RevolversPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: RevolversDrop
  - type: EmitSoundOnLand
    sound:
      collection: RevolversDrop
  # Goobstation edit end
  # Mono - Gun stock attack
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        Blunt: 12
    angle: 20
    wideAnimationRotation: -80
    animation: WeaponArcThrust
    soundHit:
      collection: MetalThud
  - type: AltFireMelee
    attackType: Light
  # Mono end

- type: entity
  name: Garter (.357 magnum)
  parent: BaseWeaponRevolver
  id: WeaponRevolverInspector
  description: A robust and simple revolver, still effective even in space. Uses .357 magnum ammo.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/inspector.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/inspector.rsi
  - type: RevolverAmmoProvider
    capacity: 6
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]

- type: entity
  name: 马特巴 (.357 magnum)
  parent: [ BaseWeaponRevolver, BaseFactionGearTSFT1 ]
  id: WeaponRevolverMateba
  description: 一把企业时代的传奇配枪，曾是企业杀戮小队的装备，如今为银河系各地的TSF军官所有。使用.357 马格南弹药。枪柄上贴有“仅限授权使用”的标签。
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/mateba.rsi
  - type: Gun
    fireRate: 0.5
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/bigshot.ogg
    damageModifier: 3

- type: entity
  parent: WeaponRevolverMateba
  id: WeaponRevolverMatebaAP # For deathsquad
  suffix: armor-piercing
  components:
  - type: RevolverAmmoProvider
    proto: Cartridge357_magnumAP

- type: entity
  name: LWC 小蛇 (.357 magnum)
  parent: [ BaseWeaponRevolver, BaseFactionGearPDVT1 ]
  id: WeaponRevolverPython
  description: 一款坚固、先进的.357马格南左轮手枪设计，经受住了时间的考验。它已经进行了升级，可以实现双发连射模式。
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/python.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/python.rsi
  - type: Gun
    selectedMode: Burst
    fireRate: 2
    burstCooldown: 0.2
    burstFireRate: 10
    shotsPerBurst: 2
    availableModes:
    - SemiAuto
    - Burst
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/python_fire.ogg
      params:
        volume: 2.25
    damageModifier: 1.2
  - type: StaticPrice
    price: 1

# Mono: Gatfruit revolver variant, little FMC worth
- type: entity
  name: LWC 小蛇 (.357 magnum)
  parent: [ BaseFactionGearPDVT1, WeaponRevolverPython ]
  id: WeaponRevolverPythonGatfruit
  suffix: Low Value
  description: 一种在法厄同王朝空间常见的左轮手枪，通常由高级帝国人员使用。使用 .357 马格南弹药。它似乎是由脆弱的植物材料制成的，对于违禁品回收来说价值不高。
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Revolvers/python.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Revolvers/python.rsi
  - type: StaticPrice
    price: 1

- type: entity
  parent: WeaponRevolverPython
  id: WeaponRevolverPythonAP # For the uplink.
  suffix: armor-piercing
  components:
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - Cartridge357_magnumFMJ
        - SpeedLoader357_magnumFMJ
    proto: Cartridge357_magnumAP

