  id: EnergyDaggerBox
  name: 电子匕首盒 丨 e-dagger box
  suffix: E-Dagger
  description: 一个装有电子匕首的小盒子。包装在打开时分解，不留痕迹。 丨 A small box containing an e-dagger. Packaging disintegrates when opened, leaving no evidence behind.
