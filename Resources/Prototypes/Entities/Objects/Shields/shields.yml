- type: entity
  name: 镜盾 丨 mirror shield
  parent: BaseShield
  id: MirrorShield
  description: 诡异地泛着红光……你听见几何学者在低语。 丨 Eerily glows red... you hear the geometer whispering
  components:
    - type: Sprite
      state: mirror-icon
    - type: Item
      heldPrefix: mirror
    - type: Reflect
      reflectProb: 0.95
      reflects:
        - Energy
    - type: Blocking #Mirror shield reflects heat/laser, but is relatively weak to everything else.
      passiveBlockModifier:
        coefficients:
          Blunt: 1.2
          Slash: 1.2
          Piercing: 1.2
          Heat: .7
      activeBlockModifier:
        coefficients:
          Blunt: 1.2
          Slash: 1.2
          Piercing: 1.2
          Heat: .6
        flatReductions:
          Heat: 1
      blockSound: !type:SoundPathSpecifier
        path: /Audio/Effects/glass_step.ogg
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 40
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: GlassBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetGlass:
                  min: 5
                  max: 5

- type: entity
  name: 能量护盾
  parent: [ BaseItem, BaseFactionGearPDVT2 ] # Mono
  id: EnergyShield
  description: 一种先进的自我充能能量盾，折叠后可以放进口袋。对能量武器非常有效的防御工具。
  components:
    - type: ItemToggle
      predictable: false # WD EDIT
      soundActivate:
        path: /Audio/Weapons/ebladeon.ogg
      soundDeactivate:
        path: /Audio/Weapons/ebladeoff.ogg
      # WD EDIT START
      soundFailToActivate:
        path: /Audio/Machines/button.ogg
        params:
          variation: 0.250
      # WD EDIT END
    - type: ItemToggleActiveSound
      activeSound:
        path: /Audio/Weapons/ebladehum.ogg
    - type: ItemToggleSize
      activatedSize: Huge
    - type: ComponentToggler
      components:
      - type: DisarmMalus
        malus: 0.6
    - type: Sprite
      sprite: Objects/Weapons/Melee/e_shield.rsi
      layers:
        - state: eshield-icon
        - state: eshield-on
          color: "#FFFFFF"
          visible: false
          shader: unshaded
          map: [ "shield" ]
    - type: Item
      size: Small
      sprite: Objects/Weapons/Melee/e_shield.rsi
      heldPrefix: eshield
    - type: UseDelay
      delay: 0.5
    - type: ToggleableVisuals
      spriteLayer: shield
      inhandVisuals:
        left:
          - state: inhand-left-shield
            shader: unshaded
        right:
          - state: inhand-right-shield
            shader: unshaded
    - type: PointLight
      netsync: false
      enabled: false
      radius: 1.5
      energy: 0.7 # WD EDIT
      color: "#678AD9" # WD EDIT
    - type: ItemTogglePointLight
    - type: Reflect
      reflectProb: 0.9 # Mono EDIT
      damageOnReflectModifier: 0.2 # Mono edit
      reflects:
        - Energy
    - type: Blocking
      passiveBlockModifier:
        coefficients:
          Blunt: 1.0
          Slash: 0.9
          Piercing: 0.85
          Heat: 0.5 # WD EDIT
      activeBlockModifier:
        coefficients:
          Blunt: 1.2
          Slash: 0.85
          Piercing: 0.5
          Heat: 0.4
        flatReductions:
          Heat: 1
          Piercing: 1
    - type: Appearance
    - type: Damageable
      damageContainer: Shield
    - type: StaticPrice
      price: 350
      # WD EDIT START
    - type: Battery
      maxCharge: 60
      startingCharge: 60
    - type: BatterySelfRecharger
      autoRecharge: true
      autoRechargeRate: 5
    - type: RechargeableBlocking
      # WD EDIT END
    - type: ClothingSpeedModifier # Mono
      sprintModifier: 0.9
    - type: HeldSpeedModifier

