    mode: Diagonal
    key: walls
    base: state
  - type: Icon
    sprite: Structures/Walls/reinforced_diagonal.rsi
    state: state0
  - type: Destructible # Mono - override HP stats from parent: WallShuttleDiagonal, matches reinforced wall
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1100 # Mono
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 1000 # Mono
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: ShipRepairable
    repairTime: 2
    repairCost: 3

