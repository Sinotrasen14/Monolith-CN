- type: entity
  id: ContrabandPallet
  name: 走私货交换托盘
  description: 指定可以用来向中央司令部兑换联邦军用积分的有效物品。
  parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, BaseStructure] # Frontier - BaseStructureDisabledToolsUse,BaseStructureIndestructible
  components:
  - type: InteractionOutline
  - type: Anchorable
  - type: CollideOnAnchor
  - type: Physics
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 15
        mask:
          - MachineMask
  - type: ContrabandPallet
  - type: StaticPrice
    price: 100
  - type: Sprite
    drawdepth: FloorTiles
    layers:
    - sprite: _NF/Structures/Machines/contraband_pallet.rsi
      state: base

# Rogue version
- type: entity
  id: ContrabandPalletPirate
  name: 数据交换平台
  description: 上传被偷的资产和违禁品换取数据筹码。
  parent: ContrabandPallet
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/piratebounty_pallet.rsi
    layers:
    - state: base
    - state: unshaded
      shader: unshaded

