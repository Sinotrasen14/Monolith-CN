- type: entity
  id: BlueprintReceiverBase
  abstract: true
  components:
  - type: BlueprintReceiver
    whitelist:
      tags:
      - BlueprintAutolathe
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      blueprint: !type:Container
  - type: EmptyOnMachineDeconstruct
    containers:
    - blueprint

- type: entity
  parent: [ BlueprintReceiverBase, BaseLatheLube ]
  id: ServiceTechFab
  name: 服务技术复合机
  description: 为服务人员打印设备。
  components:
  - type: Sprite
    netsync: false
    sprite: Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: service
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: ServiceTechFabCircuitboard
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - NFServiceTechfabDeprecatedStatic
    - ReportingStatic # DeltaV
    dynamicPacks:
    - NFServiceTechfabDeprecated
  - type: EmagLatheRecipes
    emagStaticPacks:
    - NFServiceTechfabDeprecatedEmagStatic
  - type: PirateBountyItem # Mono
    id: Techfab

- type: entity
  parent: [ BlueprintReceiverBase, BaseLatheLube ]
  id: EngineeringTechFab
  name: 工程复合机
  description: Prints equipment for engineers.
  components:
  - type: Sprite
    netsync: false
    sprite: Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: engi
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: EngineeringTechFabCircuitboard
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - NFEngineeringTechfabDeprecatedStatic
    # Mono
    - GasMiningStatic
    - AutomationStatic
    # Mono End
    dynamicPacks:
    - NFEngineeringTechfabDeprecated
    - RCD # Mono
  - type: PirateBountyItem # Mono
    id: Techfab

- type: entity
  parent: [ BlueprintReceiverBase, BaseLatheLube ]
  id: SalvageTechfabNF
  name: 打捞复合机
