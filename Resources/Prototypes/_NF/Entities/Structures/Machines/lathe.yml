- type: entity
  id: NfsdTechFab
  parent: [ BlueprintReceiverBase, SecurityTechFab ]
  name: TSFMC 复合机
  description: Prints equipment for use by TSFMC.
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: nfsd
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: NfsdTechFabCircuitboard
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - NFNfsdTechfabDeprecatedStatic
    - StaticAmmoRecipePack
    - RoundstartShipgunAmmo # Mono
    - StaticGrenades
    - MonoAttachmentsStatic # Mono
    - ReportingStatic # DeltaV
    dynamicPacks:
    - NFNfsdTechfabDeprecated
    - DynamicAmmoRecipePack
    # Mono start
    - MonoTSFWeaponsDynamicMelee
    - MonoTSFWeaponsDynamicRanged
    - MonoTSFMiscDynamic
    - UniversalShellAmmo
    - UniversalRailgunAmmo
    - UniversalMissileAmmo
    - UniversalOrdinance
    - ResearchedExplosives
    # Mono end
  - type: EmagLatheRecipes
    emagStaticPacks:
    - NFNfsdTechfabDeprecatedEmag
  - type: PirateBountyItem # Mono
    id: Techfab

- type: entity
  id: MercenaryTechFab
  parent: [ BlueprintReceiverBase, BaseLatheLube ]
  name: 佣兵复合机
  description: Prints the bare minimum of tools of the trade that any budget mercenary or private security could need. Nothing fancy.
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: mercenary
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: MercenaryTechFabCircuitboardNF
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - NFMercenaryTechfabDeprecatedStatic
    - StaticAmmoRecipePack
    - MonoRestraintsStatic # Mono
    - RoundstartShipgunAmmo # Mono
    - StaticGrenades
    - MonoAttachmentsStatic # Mono
    dynamicPacks:
    - NFMercenaryTechfabDeprecated
    - DynamicAmmoRecipePack
    # Mono start
    - MonoTSFWeaponsDynamicMelee
    - MonoTSFWeaponsDynamicRanged
    - MonoTSFMiscDynamic
    - MonoRogueWeaponsDynamicMelee
    - MonoRogueWeaponsDynamicRanged
    - MonoRogueMiscDynamic
    # Universal shit (stuff like shipgun ammo)
    - UniversalRailgunAmmo
    - UniversalMissileAmmo
    - UniversalShellAmmo
    - UniversalOrdinance
    - SecurityEquipment
    - SmartGun #Smart SMG
    # Mono end
  - type: EmagLatheRecipes
    emagStaticPacks:
    - NFMercenaryTechfabDeprecatedEmag
  - type: PirateBountyItem # Mono
    id: Techfab

- type: entity
  id: MercenaryTechFabHacked
  parent:
  - MercenaryTechFab
  - BaseHyperlathe
  - PunkHoloGraffitiOverlay # Prototype can be located at /Resources/Prototypes/_NF/Entities/Structures/Holographic/graffiti.yml
  name: 骇入的佣兵复合机
  description: 打印出任何经济型雇佣兵或私人保安所需的最基本工具。没什么花哨的。
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: mercenary
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - sprite: _NF/Structures/Holo/graffiti/simple.rsi
      state: holograffiti01
      map: [ "graffiti" ]
      shader: unshaded
      scale: 0.7, 0.7
  - type: Machine
    board: MercenaryTechFabCircuitboardHackedNF
  - type: PointLight
    radius: 1.5
    energy: 2
  - type: RgbLightController
    layers: [ 0 ]
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - NFHackedMercenaryTechfabDeprecatedStatic
    - StaticAmmoRecipePack
    - MonoRestraintsStatic
    - RoundstartShipgunAmmo # Mono
    - StaticGrenades
    - MonoAttachmentsStatic # Mono
    dynamicPacks:
    - NFHackedMercenaryTechfabDeprecated
    - DynamicAmmoRecipePack
    - SmartGun # Goobstation
    # Mono start
    - MonoTSFWeaponsDynamicMelee
    - MonoTSFWeaponsDynamicRanged
    - MonoTSFMiscDynamic
    - MonoRogueWeaponsDynamicMelee
    - MonoRogueWeaponsDynamicRanged
    - MonoRogueMiscDynamic
    # Universal shit (stuff like shipgun ammo)
    - UniversalRailgunAmmo
    - UniversalMissileAmmo
    - UniversalShellAmmo
    - UniversalOrdinance
    # Mono end
  - type: PirateBountyItem # Mono
    id: Techfab

- type: entity
  parent: [BaseStructureDisableToolUse, BaseLathe]
  id: PrizeCounter
  name: 奖品柜台
  description: 领取你的奖品，赢取一些玩具和可爱的毛绒玩具吧！
  components:
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 3
    enabled: false
    sound:
      path: /Audio/Ambience/Objects/vending_machine_hum.ogg
  - type: LitOnPowered
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: Advertise
    pack: CuddlyCritterAds
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#4b93ad"
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _NF/Structures/Machines/prizecounter.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - NFPrizeCounterStatic
  - type: EmagLatheRecipes
    emagStaticPacks:
    - NFPrizeCounterEmag
  - type: MaterialStorage
    whitelist:
      tags:
        - PrizeTicket

- type: entity
  id: BlueprintLithograph
  parent: BaseLatheLube
  name: 蓝图打印机
  description: Prints blueprints.
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/blueprint_printer.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: BlueprintLithographMachineCircuitboard
  - type: Lathe
    producingSound: /Audio/Machines/circuitprinter.ogg
    idleState: icon
    runningState: building
    staticPacks:
    - PowerCellsStatic
    dynamicPacks:
    - NFBlueprints
  - type: RequireProjectileTarget

- type: entity
  id: ScrapProcessor
  parent: BaseLatheLube
  name: 废料回收机
  description: 它用废料生产板材和锭子。
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/scrap_processor.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unshaded
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: NFScrapProcessorCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
      - Ore
  - type: Lathe
    idleState: icon
    runningState: building
    unlitIdleState: unshaded
    unlitRunningState: building-unshaded
    defaultProductionAmount: 10
    productValueModifier: null
    staticPacks:
    - NFScrapStatic
    - MonoTradeCratesScrapProcessor

- type: entity
  id: MedicalAssembler
  parent: BaseLatheAssembler
  name: 医疗装配工
  description: 显然对医学很好。你不知道它是怎么起作用的。
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/medical_assembler.rsi
    snapCardinals: true
    layers:
    - state: mediwave-base
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: mediwave-off-unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: Machine
    board: MedicalAssemblerMachineCircuitboard
  - type: Lathe
    reagentOutputSlotId: beaker_slot
    idleState: icon
    runningState: mediwave-base
    unlitIdleState: mediwave-off-unlit
    unlitRunningState: mediwave-on-unlit
    staticPacks:
    - MedicalAssemblerStatic

- type: entity
  id: BiogeneratorFill
  parent: Biogenerator
  name: 生物发生器
  suffix: Biomass, 50
  components:
  - type: MaterialStorage
    storage:
      Biomass: 50
