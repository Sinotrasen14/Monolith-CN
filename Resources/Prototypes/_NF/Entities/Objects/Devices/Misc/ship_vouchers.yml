# 舰船兑换券s, used to redeem for free ships!
- type: entity
  abstract: true
  parent: BaseItem
  id: BaseShipVoucher
  name: 舰船兑换券
  description: 用于从船厂免费租用舰船。
  components:
  - type: Sprite
    sprite: _NF/Objects/Misc/shipyard_voucher.rsi
  - type: Item
    size: Small
    heldPrefix: default
    storedRotation: -90
  - type: StationRecordKeyStorage # Assuming ships purchased on vouchers still need recordkeeping.
  - type: StaticPrice
    price: 0
  - type: CargoSellBlacklist
  - type: NFShipyardVoucher # FIXME - whitelist component to prevent misprediction

# Service voucher
- type: entity
  parent: BaseShipVoucher
  id: ShipVoucherFrontierService
  name: 服务舰船兑换卡
  description: 允许从边境员工船厂免费购买一艘小型服务船。出售时会被销毁。
  components:
  - type: Sprite
    layers:
    - state: blue
    - state: voucherservice
  - type: ShipyardVoucher
    consoleType: Shipyard
    vessels:
    - Jitterbug
    - McChicken
    - McChilly
    - Spessbite

# Frontier vouchers
- type: entity
  parent: BaseShipVoucher
  id: ShipVoucherFrontierJanitor
  name: 清洁工 舰船兑换券
  description: 允许从边境员工船厂免费购买一艘清洁船。出售时会被销毁。
  components:
  - type: Sprite
    layers:
    - state: blue
    - state: voucherjanitor
  - type: Item
    heldPrefix: blue
  - type: ShipyardVoucher
    destroyOnEmpty: true
    consoleType: Sr
    access:
    - Janitor

- type: entity
  parent: ShipVoucherFrontierJanitor
  id: ShipVoucherFrontierMailCarrier
  name: 邮递员 舰船兑换券
  description: 允许从前沿职员船厂免费购买一艘邮件船。出售时会被毁掉。
  components:
  - type: Sprite
    layers:
    - state: blue
    - state: vouchermailcarrier
  - type: ShipyardVoucher
    access:
    - Mail

- type: entity
  parent: ShipVoucherFrontierJanitor
  id: ShipVoucherFrontierGuard
  name: 站点巡逻 舰船兑换券
  description: 允许从前沿职员船厂免费购买一艘警戒舰。出售时会被销毁。
  components:
  - type: Sprite
    layers:
    - state: blue
    - state: voucherstationguard
  - type: ShipyardVoucher
    access:
    - Brig # odd, but potentially restricts cadets in lieu of a security guard-only access level
