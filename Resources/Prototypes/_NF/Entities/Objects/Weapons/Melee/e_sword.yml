- type: entity
  name: TSFMC 能量剑
  parent: [ BaseFactionGearTSFT2, EnergySword ]
  id: EnergySwordNfsd
  description: 一把非常响亮且危险的剑，剑刃由纯净、浓缩的等离子体构成。能像切黄油一样切开没有护甲的目标。
  components:
  - type: EnergySword
    colorOptions:
      - "#bfdaff" # Mono
    blockHacking: true

- type: entity
  id: NFEnergyPickaxe
  parent: EnergySword # Has a reflect chance
  name: 全息十字矿镐
  description: 一款全息采矿工具，刀片由硬光组成。威力不如能量武器，但关掉时比大多数采矿工具更紧凑。
  components:
  - type: ItemToggleSize
    activatedSize: Huge
    activatedShape:
    - 0,0,2,0
    - 1,1,1,2
  - type: MeleeWeapon
    autoAttack: true
  - type: ItemToggleMeleeWeapon
    activatedDamage:
        types: # Mono start: 0.5dps higher than standard wielded pickaxe with worse trading power
          Heat: 10 # 8 >> 10
          Piercing: 10 # 2 >> 10
          Structural: 75 #Mono end: 40 >> 75
    deactivatedSecret: true
  - type: Sprite
    sprite: _NF/Objects/Weapons/Melee/energy_pickaxe.rsi
    layers:
      - state: e-pickaxe
      - state: e-pickaxe-blade
        color: "#e95151"
        visible: false
        shader: unshaded
        map: [ "blade" ]
  - type: Item
    sprite: _NF/Objects/Weapons/Melee/energy_pickaxe.rsi
    storedRotation: -45
  - type: Clothing
    sprite: _NF/Objects/Weapons/Melee/energy_pickaxe.rsi
    quickEquip: false
    slots:
    - Belt
    - back
    - suitStorage
  - type: ToggleableVisuals
    spriteLayer: blade
    inhandVisuals:
      left:
      - state: inhand-left-blade
        shader: unshaded
      right:
      - state: inhand-right-blade
        shader: unshaded
  - type: Reflect # Explicitly specified the value (the default one from the parent might be too high)
    reflectProb: 0.05
  - type: Tag
    tags:
    - Pickaxe
  - type: StaticPrice
    price: 200
  - type: MiningGatheringSoft
  - type: MiningGatheringHard
