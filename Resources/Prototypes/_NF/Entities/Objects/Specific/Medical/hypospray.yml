- type: entity
  name: NTCS-101 无针注射器
  parent: BaseItem
  description: 由纳米传讯化学供应部门设计的商用化学注射器。为消费市场配备了两项安全特性：小型化学品储罐和注射延迟。
  id: HypoMini
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Medical/hypomini.rsi
    state: hypo
  - type: Item
    sprite: _NF/Objects/Specific/Medical/hypomini.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 20
  - type: RefillableSolution
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
  - type: Hypospray
    onlyAffectsMobs: false
  - type: UseDelay
    delay: 1
  - type: StaticPrice
    price: 550
    vendPrice: 5000 # Mono
  - type: PirateBountyItem # Frontier
    id: HypoMini # Frontier

