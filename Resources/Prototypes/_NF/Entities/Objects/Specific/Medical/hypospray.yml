- type: entity
  name: 空医疗笔
  parent: BaseItem
  description: 一支充满无限潜能的空医疗笔。禁止偏离纳米传讯配方。
  id: BlankMediPen
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Medical/medipen.rsi
    state: medipen
  - type: Item
    sprite: _NF/Objects/Specific/Medical/medipen.rsi

- type: entity
  parent: ChemicalMedipen
  id: NFChemicalMedipen
  abstract: true
  components:
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
  - type: Hypospray
    solutionName: pen
    onlyAffectsMobs: false
    injectOnly: true
    transferAmount: 15 # Explicitly redefined in case parent changes
  - type: Tag
    tags: []

- type: entity
  name: 止血-自动注射笔
  parent: NFChemicalMedipen
  id: HemostasisAutoInjector
  description: 快速注射凝血剂和循环液体。含有氨甲环酸(tranexamic)和生理盐水(saline)。
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: hemostasispen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    emptySpriteName: hemostasispen_empty
  - type: Hypospray
    transferAmount: 20
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 20
        reagents:
        - ReagentId: TranexamicAcid
          Quantity: 5
        - ReagentId: Saline
          Quantity: 15

- type: entity
