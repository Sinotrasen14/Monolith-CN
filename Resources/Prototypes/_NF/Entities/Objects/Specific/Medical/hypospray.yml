- type: entity
  name: NTCS-101 无针注射器
  parent: BaseItem
  description: 由纳米传讯化学供应部门设计的商用化学注射器。为消费市场配备了两项安全特性：小型化学品储罐和注射延迟。
  id: HypoMini
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Medical/hypomini.rsi
    state: hypo
  - type: Item
    sprite: _NF/Objects/Specific/Medical/hypomini.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 20
  - type: RefillableSolution
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
  - type: Hypospray
    onlyAffectsMobs: false
  - type: UseDelay
    delay: 1
  - type: StaticPrice
    price: 550
    vendPrice: 5000 # Mono
  - type: PirateBountyItem # Frontier
    id: HypoMini # Frontier

- type: entity
  name: NTCS-102 无针注射器
  parent: HypoMini
  description: 由纳米传讯化学供应部门设计的商用化学注射器。相比商业版本具有更大的化学品储罐和略微缩短的注射延迟。
  id: HypoBrigmedic
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Medical/hypobrigmedic.rsi
    state: hypo
  - type: Item
    sprite: _NF/Objects/Specific/Medical/hypobrigmedic.rsi
  - type: SolutionContainerManager # Mono
    solutions:
      hypospray:
        maxVol: 25 # why is a lawenforcement version the same as a civilian version?
  - type: RefillableSolution
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
  - type: Hypospray
    onlyAffectsMobs: false
  - type: UseDelay
    delay: 0.75
  - type: StaticPrice
    price: 750  # Mono end

- type: entity
  name: NTCS-103 无针注射器
  parent: HypoMini
  description: 由纳米传讯化学供应部门作为限量版设计的实验型改良化学注射器。具有更短的注射延迟和略微调整的化学品储罐。
  id: HypoMiniLimitedEdition
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Medical/hypominilimitededition.rsi
    state: hypo
  - type: Item
    sprite: _NF/Objects/Specific/Medical/hypominilimitededition.rsi
  - type: StaticPrice # Mono
    price: 20 # 20 whole dollars
    vendPrice: 10000
  - type: UseDelay
    delay: 0.65

- type: entity
  name: 空医疗笔
  parent: BaseItem
  description: 一支充满无限潜能的空医疗笔。禁止偏离纳米传讯配方。
  id: BlankMediPen
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Medical/medipen.rsi
    state: medipen
  - type: Item
    sprite: _NF/Objects/Specific/Medical/medipen.rsi

- type: entity
  parent: ChemicalMedipen
  id: NFChemicalMedipen
  abstract: true
  components:
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
  - type: Hypospray
    solutionName: pen
    onlyAffectsMobs: false
    injectOnly: true
    transferAmount: 15 # Explicitly redefined in case parent changes
  - type: Tag
    tags: []

- type: entity
  name: 止血-自动注射笔
  parent: NFChemicalMedipen
  id: HemostasisAutoInjector
  description: 快速注射凝血剂和循环液体。含有氨甲环酸(tranexamic)和生理盐水(saline)。
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: hemostasispen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    emptySpriteName: hemostasispen_empty
  - type: Hypospray
    transferAmount: 20
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 20
        reagents:
        - ReagentId: TranexamicAcid
          Quantity: 5
        - ReagentId: Saline
          Quantity: 15

- type: entity
  name: 兴奋剂-自动注射笔
  parent: NFChemicalMedipen
  id: StimulantAutoInjector
  description: 快速注射强效兴奋剂和镇痛剂。含有去氧麻黄碱(desoxyephedrine)和地洛文(dylovene)。请极其谨慎使用。
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: stimulantpen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    emptySpriteName: stimulantpen_empty
  - type: Hypospray
    transferAmount: 20
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 20
        reagents:
        - ReagentId: Desoxyephedrine
          Quantity: 10
        - ReagentId: Dylovene
          Quantity: 10

