# Safety Deposit Box Entities

# Base parent for all safety deposit boxes
- type: entity
  id: SafetyDepositBoxBase
  abstract: true
  parent: BaseStorageItem
  components:
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }
  - type: Storage
    blacklist:
      components:
      - IdCard # Fuckery, abusable
      - Currency # Balance
      # - Store # Balance
      - EncryptionKey # Balance
      - Headset # Ditto
      - Storage # Prevent recursion
      - SafetyDepositBox # Prevent recursion
      - ShipyardVoucher # Mfw 6 T4 vouchers in one box
      - OverwatchConsole # Requested by staff
      - GhostRoleMobSpawner # Reinforcement radios
      - DoorRemote # Requested by staff
      - NukeDisk # Might be abusable in some way, who knows. # items exchangeable for FMC or DC. this also includes a large portion of faction gear which shouldn't be persistent for balance reasons
      - ThiefUndeterminedBackpack # no stashing an entire fucking judge/overseer modsuit or spasaka/TARKHAN/MARSOC kit
      - AccessOverrider # Access configs can bypass the ID card storage.
      - PDA # See above # Bypasses reagent storage # lets you lockbox TSF servers and shit :face_holding_back_tears: # ditto
      tags:
      - Unstashable
      - SafetyDepositBlacklist
  - type: SafetyDepositBox
  - type: Appearance
  - type: Tag
    tags:
    - SafetyDepositBox

- type: entity
  id: SafetyDepositBoxSmall
  name: 小型保险箱
  description: 一个用于存放贵重物品的小型安全箱。可以放置 2x2 个物品。
  parent: SafetyDepositBoxBase
  components:
  - type: Sprite
    sprite: _WF/Objects/Economy/depositboxsmall.rsi
    state: icon
  - type: Item
    size: Small
  - type: SafetyDepositBox
    cost: 3500000
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,1,1

- type: entity
  id: SafetyDepositBoxMedium
  name: 中型保险箱
  description: 一个中等安全的储物箱，用来存放贵重物品。可以放 2x4 件物品。
  parent: SafetyDepositBoxBase
  components:
  - type: Sprite
    sprite: _WF/Objects/Economy/depositboxmedium.rsi
    state: icon
  - type: Item
    size: Normal
  - type: SafetyDepositBox
    cost: 5000000
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,1,3

- type: entity
  id: SafetyDepositBoxLarge
  name: 大型保险箱
  description: 一个用于存放贵重物品的大型安全箱。可以容纳 2x6 件物品。
  parent: SafetyDepositBoxBase
  components:
  - type: Sprite
    sprite: _WF/Objects/Economy/depositboxlarge.rsi
    state: icon
  - type: Item
    size: Large
  - type: SafetyDepositBox
    cost: 8000000
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,1,5

- type: entity
  id: SafetyDepositConsole
  name: 保险箱控制台
  description: 一个用于购买和管理保险箱的控制台。
  parent: BaseStructure
  components:
  - type: Sprite
    netsync: false
    noRot: true
    sprite: _WF/Structures/Machines/atm/depositatm.rsi
    layers:
    - map: ["computerLayerBody"]
      state: icon
    - map: ["computerLayerScreen"]
      state: unshaded
  - type: SafetyDepositConsole
    smallBoxProto: SafetyDepositBoxSmall
    mediumBoxProto: SafetyDepositBoxMedium
    largeBoxProto: SafetyDepositBoxLarge
    boxSlot:
      name: safety-deposit-console-boxSlot
      insertSound: /Audio/Machines/scanning.ogg
      ejectSound: /Audio/Machines/tray_eject.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        tags:
        - SafetyDepositBox
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      safety-deposit-console-boxSlot: !type:ContainerSlot
  - type: ActivatableUI
    key: enum.SafetyDepositConsoleUiKey.Key
  - type: InteractionOutline
  - type: UserInterface
    interfaces:
      enum.SafetyDepositConsoleUiKey.Key:
        type: SafetyDepositConsoleBoundUserInterface
  - type: Anchorable
  - type: Pullable
