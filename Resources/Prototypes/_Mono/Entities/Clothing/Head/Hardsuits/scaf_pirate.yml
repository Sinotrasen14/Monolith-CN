- type: entity
  parent: [ClothingHeadHardsuitBase, BaseC3SyndicateContraband]
  id: ClothingHeadHelmetHardsuitPirateScaf
  name: PDV SCAF硬质防护头盔
  description: 一件采用PDV棕褐色涂装的旧SCAF防护服。照明系统已更换为热脉冲装置。
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/scaf_pirate.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/scaf_pirate.rsi
  - type: ThermalVision
    flashDurationMultiplier: 2
    pulseTime: 3
    isEquipment: true
    toggleAction: PulseThermalVision
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
