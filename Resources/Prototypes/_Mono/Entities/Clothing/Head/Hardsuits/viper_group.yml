  name: 'IMP mk.III 毒蛇硬质防护头盔 | IMP mk.III viper hardsuit helmet'
  description: '带有蝰蛇小组标志性标记的硬质防护头盔。配备内置医疗平视显示器并辅以热脉冲系统。 | A hardsuit helmet with signature markings of the Viper Group. Has a built-in medical HUD complemented by thermal pulse systems.'
