- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase, ShowSecurityIcons]
  id: ClothingHeadHelmetHardsuitViperGroupStandard
  name: '胡狼mk.II毒蛇重型防护头盔 | JACKAL mk.II viper hardsuit helmet'
  description: '带有蝰蛇小队标志性标记的硬质头盔。配备内置夜视系统。 | A hardsuit helmet with signature markings of the Viper Group. Has a built-in nightvision system.'
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/viper_group_standard.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/viper_group_standard.rsi
  - type: PointLight
    color: "#eb772a"
  - type: NightVision # Gen 4 dualtube
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 400
    viewCircleCount: 2
    viewCircleSpacing: 260
    phosphorColor: "#41D7D9"
    lightingColor: "#FFFFFF32"
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: FlashImmunity
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide

- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase, ShowMedicalIcons, ShowSecurityIcons]
