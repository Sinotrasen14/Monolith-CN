- type: entity
  parent: [ClothingNeckBase] # Frontier: BaseCommandContraband<BaseC2ContrabandUnredeemable
  id: ClothingNeckCloakUssp
  name: '政委阅兵斗篷 | Commissar parade cloak'
  description: '一件精美白红蓝金四色相间的斗篷，适合能够对部队确立威信之人。 | An exquisite white, red, blue and gold cloak fitting for those who can assert dominance over their troops.'
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Neck/Cloaks/ussp.rsi
  - type: StealTarget
    stealGroup: HeadCloak

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckCloakBlack
  name: '黑色斗篷 | black cloak'
  description: '一件黑色斗篷，看起来有些陈旧。 | A black cloak, looks old.'
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Neck/Cloaks/blackcloak.rsi

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckCloakRogueCommander
  name: PDV大宰相的斗篷 | grand vizier's cloak
  description: 一件法厄同王朝大宰相的斗篷，仅授予那些已经证明对事业忠诚和有价值的人。有些人说，如果不是工会遗迹的提升，巨像的居民永远不会超越孤立主义的殖民地形成更大的文明。
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Neck/Cloaks/phaethondynastycloak.rsi

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckCloakVizier
  name: grand vizier's ceremonial cloak
  description: A Phaethon Dynasty Grand Vizier's cloak, only given to those who have proven their loyalty and worth to the Sultan.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Neck/Cloaks/pdvcloak.rsi

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckMantleVizier
  name: grand vizier's mantle
  description: A Phaethon Dynasty Grand Vizier's mantle, a mix of elegance and practicality.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Neck/Cloaks/pdvmantle.rsi

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckCloakCOG
  name: '旧长袍 | Old robe'
  description: '一件来自已消亡教派的古老深红色长袍。 | An ancient crimson draping from a now-defunct cult.'
  components:
  - type: Sprite
    scale: 0.6, 0.6
    sprite: _Mono/Clothing/Neck/Cloaks/cogcloakicon.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Neck/Cloaks/cogcloak.rsi
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:Container { }
      storagebase: !type:Container
        ents: [ ]
  - type: ToggleableClothing
    requiredSlot: neck
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHatCOG

