# Bomb Collars

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckBombCollar
  name: bomb collar
  suffix: Unremovable
  description: A hardened, explosive collar that locks tight around the neck. When signaled, detonates after a delay of 5 seconds. Useful to keep people in line.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Neck/Misc/bomb-collar.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Neck/Misc/bomb-collar.rsi
    stripDelay: 15
    equipDelay: 5 # to avoid accidentally falling into the trap associated with SelfUnremovableClothing
    unequipDelay: 30
  - type: UnremovableClothing
  - type: TimerStartOnSignal
  - type: AutomatedTimer
  - type: OnUseTimerTrigger
    delay: 5
    initialBeepDelay: 0
    beepSound: /Audio/Machines/timer.ogg
  - type: DeviceLinkSink
    ports:
      - Timer
  - type: Explosive
    explosionType: Minibomb #you may survive with a bombsuit lol
    totalIntensity: 50
    intensitySlope: 40
    maxIntensity: 50
    canCreateVacuum: false
  - type: ExplodeOnTrigger
  - type: SpamEmitSound
    minInterval: 360
    maxInterval: 1800
    sound: /Audio/Machines/timer.ogg
  - type: Tag
    tags:
      - BombCollar

- type: entity
  parent: ClothingNeckBombCollar
  id: ClothingNeckNukeCollar
  name: nuke collar
  suffix: Unremovable, Admin, Admeme
  description: A hardened, explosive collar with a mini-nuke attached. Mildly radioactive.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Neck/Misc/nuke-collar.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Neck/Misc/nuke-collar.rsi
  - type: Explosive
    explosionType: Minibomb # uh oh
    totalIntensity: 75000
    intensitySlope: 20
    maxIntensity: 500
  - type: RadiationSource
    intensity: 0.2

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckWearableCamera
  name: wireless camera #bodycam but currently it has more use than that
  description: A wireless camera made to observe the battlefield from the safety of your base. Can be worn in the neck slot.
  components:
    - type: Sprite
      sprite: _Mono/Clothing/Neck/Misc/pir.rsi
      layers:
        - state: tsfbox
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: SurveillanceCameraSecurity
      transmitFrequencyId: SurveillanceCamera
    - type: SurveillanceCamera
      networkSet: true
      nameSet: True
      id: Bodycam
    - type: Eye
    - type: WirelessNetworkConnection
      range: 40000 # Modify this to change the range, make sure to change the range of the respective router to be the same
    - type: SurveillanceCameraMicrophone
      blacklist:
        components:
        - SurveillanceCamera
        - RadioSpeaker
        - SurveillanceCameraMonitor
    - type: ActiveListener
      range: 6
    - type: ClothingGrantComponent
      component:
      - type: StationAiVision
        range: 4

- type: entity
  parent: ClothingNeckWearableCamera
  id: ClothingNeckWearableCameraPDV
  name: PDV wireless camera
  components:
    - type: Sprite
      sprite: _Mono/Clothing/Neck/Misc/pir.rsi
      layers: 
        - state: pdvbox
    - type: DeviceNetwork
      receiveFrequencyId: SurveillanceCameraPDV

- type: entity
  parent: ClothingNeckWearableCamera
  id: ClothingNeckWearableCameraTSF
  name: TSF wireless camera
  components:
    - type: Sprite
      sprite: _Mono/Clothing/Neck/Misc/pir.rsi
      layers:
        - state: tsfbox
    - type: DeviceNetwork
      receiveFrequencyId: SurveillanceCameraTSF

- type: entity
  parent: ClothingNeckWearableCamera
  id: ClothingNeckWearableCameraMMC
  name: MMC wireless camera
  components:
    - type: Sprite
      sprite: _Mono/Clothing/Neck/Misc/pir.rsi
      layers:
        - state: civbox
    - type: DeviceNetwork
      receiveFrequencyId: SurveillanceCameraMMC