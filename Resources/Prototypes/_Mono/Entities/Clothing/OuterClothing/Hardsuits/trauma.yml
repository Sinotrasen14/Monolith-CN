- type: entity
  abstract: true
  id: BaseSuitSiren
  components:
  - type: ItemToggle
    onUse: false
    soundActivate:
      path: /Audio/Items/flashlight_on.ogg
    soundDeactivate:
      path: /Audio/Items/flashlight_off.ogg
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/Effects/Vehicle/ambulancesiren.ogg
      params:
        volume: -4
  - type: UseDelay
    delay: 1.0
  - type: ToggleClothing
    action: ActionToggleParamedicSiren
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    radius: 2
    energy: 2
    color: blue
    mask: /Textures/Effects/LightMasks/double_cone.png
  - type: RotatingLight
    speed: 360
    
- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseSuitSiren ]
  id: ClothingOuterHardsuitTrauma
  name: '武装创伤单元T-23战术服 | armed trauma unit T-23 tacsuit'
  description: '武装创伤单元标准作战服。头盔集成有短程质量扫描仪。 | The standard combat suit for the Armed Trauma Unit. It has an integrated limited-range mass scanner in the helmet.'
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/trauma.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/trauma.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.8
        Radiation: 0.6
        Caustic: 0.7
  - type: StaminaDamageResistance # Mono - Stamres
    coefficient: 0.50
  - type: ClothingSpeedModifier
    walkModifier: 1.15
    sprintModifier: 1.15
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitTrauma
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaticPrice
    price: 1400
    vendPrice: 10000

- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseSuitSiren ]
  id: ClothingOuterHardsuitTraumaLeader
  name: '武装创伤单元T-53战术套装 | armed trauma unit T-53 tacsuit'
  description: '为在猛烈火力下运送关键伤员而研发，这是武装创伤单元队长的标准装备，配备重型护甲及与之匹配的集成式远程质量扫描仪。 | Developed for extracting mission-critical patients under heavy fire, this is the standard gear of the Armed Trauma Unit''s captain, with heavy plating and an integrated long-range mass scanner to match.'
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/trauma_leader.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/trauma_leader.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.4
        Heat: 0.55
        Radiation: 0.5
        Caustic: 0.6
  - type: StaminaDamageResistance
    coefficient: 0.55
  - type: ClothingSpeedModifier
    walkModifier: 1.05
    sprintModifier: 1.05
  - type: HeldSpeedModifier
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitTraumaLeader
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaticPrice
    price: 4200
    vendPrice: 25000
