# Drake Industries

- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterDrakeIndustriesTruckerPuffyVest
  name: '蓬松背心 | puffy vest'
  description: '一件外观花哨且略带弹性的蓬松背心。稍有动作就会发出惊人的噪音，不过至少他们费心在内侧做了几个口袋。 | A flashy looking puffy and somewhat elastic vest. It makes an insane amount of noise at the slighest movement, but at least they bothered making some pockets on the inside.'
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Vests/DI-puffy-vest.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Vests/DI-puffy-vest.rsi

  #Elite web vest
- type: entity
  parent: [ClothingOuterStorageBase, AllowSuitStorageClothing]
  id: ClothingOuterVestWebElite
  name: elite web vest
  description: A synthetic armor vest. This one has added webbing and heat resistant fibers.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Vests/elitevest.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Vests/elitevest.rsi
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.7
        Heat: 0.3
        Radiation: 0.5
        Caustic: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: FireProtection
    reduction: 0.85
  - type: StaminaDamageResistance # Mono - Stamres
    coefficient: 0.3
