# boxes

- type: entity
  id: BoxDispenserFlare
  parent: BaseAmmoProvider # this is for cycling flares out and not spawning 9 entities
  name: 紧急照明弹发射器
  description: 发射应急信号弹。
  components:
  - type: Sprite
    layers:
    - state: boxwide
    - state: flare
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - SignalFlareLaunchable
    proto: Flare
    capacity: 12
  - type: StaticPrice
    price: 10

