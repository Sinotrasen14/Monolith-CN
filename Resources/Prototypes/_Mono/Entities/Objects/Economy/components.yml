# matter bins

- type: entity
  id: MatterBinEconomy1
  name: 物质箱
  description: 用于存放工业过程中所需的化学品和其他物质。可以开关。里面有试剂的时候别把它当组件使用！
  parent: BaseEconomyGood
  components:
  - type: Tag
    tags:
    - EconomyGood
    - MatterBinEconomy1
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "canister_open"}
          False: {state: "canister"}
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: canisterfill
    inHandsFillBaseName: -fill-
  - type: Appearance
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    layers:
    - state: canister
      map: ["enum.OpenableVisuals.Layer"]
    - state: canisterfill1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Openable
    sound:
      collection: flaskOpenSounds
    closeable: true
    closeSound:
      collection: flaskCloseSounds
  - type: SolutionContainerManager
    solutions:
      capsule:
        maxVol: 100
  - type: PhysicalComposition
    materialComposition:
      Steel: 500
  - type: MixableSolution
    solution: capsule
  - type: RefillableSolution
    solution: capsule
  - type: DrainableSolution
    solution: capsule
  - type: ExaminableSolution
    solution: capsule
  - type: DrawableSolution
    solution: capsule
  - type: InjectableSolution
    solution: capsule
  - type: SolutionTransfer
    canChangeTransferAmount: true
  - type: SolutionItemStatus
    solution: capsule
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: Drink
    solution: capsule
  - type: Spillable
    solution: capsule
  - type: StaticPrice
    price: 200

- type: entity
  id: MatterBinEconomy2
  name: 大型物质箱
  description: Used for storing chemicals and other substances needed for industrial processes. Much larger than its predecessor. Can be opened and closed. Don't use as a component while it has reagents inside!
  parent: [ MatterBinEconomy1, BaseEconomyGoodTier2 ]
  components:
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "canister2_open"}
          False: {state: "canister2"}
  - type: Tag
    tags:
    - EconomyGood
    - MatterBinEconomy2
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: canister2fill
    inHandsFillBaseName: -fill-
  - type: Appearance
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    layers:
    - state: canister2
      map: ["enum.OpenableVisuals.Layer"]
    - state: canister2fill1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: SolutionContainerManager
    solutions:
      capsule:
        maxVol: 250
  - type: PhysicalComposition
    materialComposition:
      Steel: 1000
      Plastic: 1000
      Glass: 500
  - type: StaticPrice
    price: 600

- type: entity
  name: 基本组件
  description: 一套机电接口系统的外壳，比如齿轮、步进电机、电缆等等。
  parent: BaseEconomyGoodTier2
  categories: [ HideSpawnMenu ]
  id: MatterBinEconomy2Spawner
  components:
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    state: "canister2"
  - type: TimedDespawn
    lifetime: 0.1
  - type: SpawnOnDespawn
    count: 0
    prototype: MatterBinEconomy2

- type: entity
  id: MatterBinEconomy3
  name: 超级组件箱
  description: 用来存放工业过程中所需的化学品和其他物质。比它的前身大得多。可以开关。里面有试剂时不要用作组件！
  parent: [ MatterBinEconomy1, BaseEconomyGoodTier3 ]
  components:
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "canister2_open"}
          False: {state: "canister3"}
  - type: Tag
    tags:
    - EconomyGood
    - MatterBinEconomy3
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: canister2fill
    inHandsFillBaseName: -fill-
  - type: Appearance
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    layers:
    - state: canister3
      map: ["enum.OpenableVisuals.Layer"]
    - state: canister2fill1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: SolutionContainerManager
    solutions:
      capsule:
        maxVol: 250
  - type: PhysicalComposition
    materialComposition:
      Steel: 1000
      Plastic: 1000
      Glass: 500
  - type: StaticPrice
    price: 2000

# end matter bins

# microprocessors

- type: entity
  name: 微处理器
  description: 一种相当常见的现场可编程微控制器。在任何需要一点点聪明才智的地方都很有用。
  parent: BaseEconomyGoodTier1
  id: MicroprocessorEconomy1
  components:
  - type: Tag
    tags:
    - EconomyGood
    - MicroprocessorEconomy1
  - type: Item
    size: Small
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    state: "microprocessor1"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 300

- type: entity
  name: 纳米处理器
  description: 一个更先进的微型计算系统，能够运行基本的操作系统！
