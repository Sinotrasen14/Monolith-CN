# T1

- type: entity
  name: 基础护甲板
  description: 一种简单、精炼的“盔甲”合金板，适用于需要结构稳定的东西。可以叠加，开始制造重型盔甲板。
  parent: ArmorPlateEconomy1Broken
  id: ArmorPlateEconomy1
  components:
  - type: Tag
    tags:
    - EconomyGood
    - ArmorPlateEconomy1
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    state: "armor1"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          ArmorPlateEconomy1Broken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 1000

- type: entity
  name: 重型装甲板（未完成）
  description: 一堆正在加工中的金属，正在被提炼成坚固的防护板。需要拧紧螺丝才能开始处理。
  categories: [ HideSpawnMenu ]
  id: ArmorPlateEconomy2UnfinishedSpawner
  components:
  - type: TimedDespawn
    lifetime: 0.1
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    state: "armor2_unfinished"
  - type: SpawnOnDespawn
    count: 1
    prototype: ArmorPlateEconomy2Start

- type: entity
  name: 破损的基础护甲板
  description: 一块简单装甲板的残骸。没什么惊讶的。
  parent: BaseEconomyGoodTier1
  id: ArmorPlateEconomy1Broken
  components:
  - type: Sprite
    sprite: _Mono/Objects/Materials/bayponents.rsi
    state: "armor1_broken"
  - type: StaticPrice
    price: 500
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Item
    size: Huge
  - type: PhysicalComposition
    materialComposition:
      Steel: 1000
      Plasteel: 500
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.8
  - type: HeldSpeedModifier

# silicon

- type: entity
  name: 硅片
  description: 一片干净的纯单晶硅。先进电子产品必备！
  parent: BaseEconomyGoodTier1
  id: SiliconWaferEconomy
  components:
  - type: Tag
    tags:
    - EconomyGood
  - type: Sprite
    sprite: _Mono/Objects/Materials/silicon.rsi
    state: "wafer"
  - type: StaticPrice
    price: 500
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SiliconWaferScrapEconomy:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    ignoreResistances: true
    damage:
      types:
        Blunt: 5
  - type: PhysicalComposition
    chemicalComposition:
      Silicon: 20

- type: entity
  name: 硅片 (x8)
  description: 一片干净的纯单晶硅。先进电子产品必备！
  categories: [ HideSpawnMenu ]
  id: SiliconWaferEconomySliceSpawner8
  components:
  - type: TimedDespawn
    lifetime: 0.1
  - type: Sprite
    sprite: _Mono/Objects/Materials/silicon.rsi
    state: "cuticon"
  - type: SpawnOnDespawn
    count: 7
    prototype: SiliconWaferEconomy

- type: entity
  name: 硅片废料
  description: 一堆破碎、受污染的硅，曾经对电脑有用。真是浪费啊。
  parent: SiliconWaferEconomy
  id: SiliconWaferScrapEconomy
  components:
