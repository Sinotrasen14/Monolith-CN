    tags:
    - EconomyGood
  - type: Sprite
    sprite: _Mono/Objects/Materials/silicon.rsi
    state: "waferscrap"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 25

