# Ullman Blade

- type: entity
  parent: BaseMeleeWeaponEnergy
  id: UllmanPlasmaBlade
  name: U.I. 不稳定等离子刀
  description: 一种独特的武器，使用焊接燃料作为催化剂点燃。不稳定的等离子体迸发出狂野而强大的火焰，暂时提升伤害输出。
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Melee/ullmansword.rsi
    layers:
    - state: e_sword
    - state: e_sword_blade
      visible: false
      shader: unshaded
      map: [ "blade" ]
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Melee/ullmansword.rsi
    slots:
    - Back
    - SuitStorage
  - type: Item
    sprite: _Mono/Objects/Weapons/Melee/ullmansword.rsi
    size: Large
  - type: MeleeWeapon
    heavyStaminaCost: 1
    wideAnimationRotation: -135
    attackRate: 1.25
    damage:
      types:
        Slash: 30
        Structural: 75
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/_Goobstation/Weapons/EswordWelder/eblade1.ogg
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
      path: /Audio/_Goobstation/Weapons/EswordWelder/eblade1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnSwing:
      path: /Audio/_Goobstation/Weapons/EswordWelder/swing.ogg
      params:
        variation: 0.125
    activatedDamage:
        types:
            Slash: 30
            Heat: 50
            Structural: 300
  - type: ItemToggle
    predictable: false
    soundActivate:
      path: /Audio/_Goobstation/Weapons/EswordWelder/on.ogg
    soundDeactivate:
      path: /Audio/_Goobstation/Weapons/EswordWelder/off.ogg
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/_Goobstation/Weapons/EswordWelder/hum.ogg
  - type: SurgeryTool # Shitmed
    startSound:
      path: /Audio/_Goobstation/Weapons/EswordWelder/hum.ogg
    endSound:
      path: /Audio/_Goobstation/Weapons/EswordWelder/eblade1.ogg
      params:
        variation: 0.250
  - type: WeaponMeleeCharge
    activeTime: 2
    cooldown: 5
    cooldownDamagePenalty:
      types:
        Slash: -10
  - type: ItemToggleHot
  - type: ComponentToggler
    components:
    - type: Reflect
      reflectProb: 0.5
      reflects:
        - Energy
  - type: EnergySword
    activatedColor: LightBlue
    colorOptions: []
  - type: Tag # WD EDIT
    tags:
    - EnergySword
  - type: Sharp
  - type: DisarmMalus
    malus: 0.6
  - type: Execution
    doAfterDuration: 4.0
  - type: UseDelay
    delay: 1

