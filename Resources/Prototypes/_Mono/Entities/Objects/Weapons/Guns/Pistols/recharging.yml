- type: entity
  parent: [ WeaponPistolAnaconda, BaseC3PirateContraband ]
  id: WeaponPistolHawk4
  name: '灰鹰四型集成消音版 | LWC HAWK-4 I.S'
  description: 一把经过改装的重型蟒蛇式手枪，用于暗杀高价值目标。这种稀有原型能够发射穿甲子弹。配备激光和全息瞄准镜，加上哑光黑色底盘和定制一体化消音器，使其成为极其致命的隐形武器，仅适合法厄同帝国先锋的真正指挥官使用。
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Pistols/hawk4.rsi
    layers:
    - state: icon
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Pistols/hawk4.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Gun
    fireRate: 2
    projectileSpeed: 65
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/hawk_fire.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletHawk
    capacity: 12
    count: 12
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1.5
    rechargeSound:
      path: /Audio/Weapons/Guns/Cock/shotgun_close.ogg
  - type: AmmoCounter
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Wieldable
  - type: LaserPointer

- type: entity
  id: BulletHawk
  name: '子弹（7x30mm 无壳弹） | bullet (7x30mm caseless)'
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 40
    armorPenetration: 0.5
