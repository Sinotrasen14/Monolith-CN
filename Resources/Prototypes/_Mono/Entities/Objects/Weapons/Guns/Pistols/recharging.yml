- type: entity
  parent: WeaponPistolAnaconda
  id: WeaponPistolHawk4
  name: '灰鹰四型集成消音版 | LWC HAWK-4 I.S'
  description: 一款经过改装的重型蟒蛇枪，用于暗杀高价值目标。这款罕见原型枪可以发射穿甲子弹。配备激光和全息瞄准器，加上哑光黑色枪身和定制的一体化消音器，使其成为一把极其致命的隐秘武器。
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Pistols/hawk4.rsi
    layers:
    - state: icon
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Pistols/hawk4.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Gun
    fireRate: 2
    projectileSpeed: 65
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/hawk_fire.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletHawk
    capacity: 7
    count: 7
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 5
    rechargeSound:
      path: /Audio/Weapons/Guns/Cock/shotgun_close.ogg
  - type: AmmoCounter
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Wieldable
  - type: LaserPointer
  - type: Tag
    tags:
    - Sidearm

- type: entity
  id: BulletHawk
  name: '子弹（7x30mm 无壳弹） | bullet (7x30mm caseless)'
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 60
    armorPenetration: 0.4

- type: entity
  parent: WeaponPistolAnaconda
  id: WeaponRevolverDragoon
  name: TPC龙骑兵军官的左轮手枪
  description: 一把沉重的左轮手枪，使用可重复发射的.500麦格农子弹。龙骑手是为PDV的大维齐尔定制的左轮手枪，旨在成为经验丰富的执法官手中的威慑之物。
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Pistols/vizier-revolver.rsi
    layers:
    - state: icon
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Gun
    fireRate: 1.5
    projectileSpeed: 75
    burstCooldown: 0.75
    burstFireRate: 12
    shotsPerBurst: 2
    selectedMode: SemiAuto
    minAngle: 1
    maxAngle: 8
    availableModes:
    - SemiAuto
    - Burst
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletDragoon
    capacity: 12
    count: 12
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1.5
    rechargeSound:
      path: /Audio/Weapons/Guns/Cock/shotgun_close.ogg
  - type: AmmoCounter
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Tag
    tags:
    - Sidearm
    - Dragoon

- type: entity
  id: BulletDragoon
  name: bullet (.500 magnum caseless)
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 50
    armorPenetration: 0.20
