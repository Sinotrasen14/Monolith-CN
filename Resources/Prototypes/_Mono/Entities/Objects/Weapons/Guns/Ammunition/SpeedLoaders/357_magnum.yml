- type: entity
  id: BaseSpeedLoader357_magnum
  name: '快速装弹器（.357 马格南） | speed loader (.357 magnum)'
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - SpeedLoader357_magnumFMJ
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - Cartridge357_magnumFMJ
    capacity: 6
  - type: Sprite
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

- type: entity
  id: SpeedLoader357_magnumFMJ
  name: '快速装弹器（.357 马格南全金属被甲弹） | speed loader (.357 magnum FMJ)'
  parent: BaseSpeedLoader357_magnum
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge357_magnumFMJ
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/SpeedLoaders/357_magnum/357_magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: base-6
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: base
    steps: 7
    zeroVisible: false
  - type: Appearance

- type: entity
  id: SpeedLoader357_magnumEmpty
  name: '快速装弹器（适用于任何.357 马格南子弹） | speed loader (.357 magnum any)'
  parent: SpeedLoader45_magnumFMJ
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/SpeedLoaders/357_magnum/357_magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      # TODO: This is actually a issue with all the speed loaders:
      #       You can mix different ammo types, but it will always
      #       use the one it was printed for.
      - state: base-6
        map: [ "enum.GunVisualLayers.Mag" ]

