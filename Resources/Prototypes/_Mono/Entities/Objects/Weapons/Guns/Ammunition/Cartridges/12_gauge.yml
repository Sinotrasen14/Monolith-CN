- type: entity
  id: BaseShellShotgun12_gauge
  name: '霰弹枪弹（12号口径） | shotgun shell (12 gauge)'
  parent: BaseCartridge
  description: '标准霰弹枪弹几乎随处可见。 | Standard shotgun round practically everywhere.'
  abstract: true
  components:
  - type: Tag
    tags:
    - Cartridge
    - ShellShotgun12_gaugeBuckshot
  - type: CartridgeAmmo
    soundEject:
      collection: ShellEject
      params:
        variation: 0.06
  - type: EmitSoundOnLand
    sound:
      collection: ShellEject
      params:
        variation: 0.06
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Casings/shotgun_shell.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 1

