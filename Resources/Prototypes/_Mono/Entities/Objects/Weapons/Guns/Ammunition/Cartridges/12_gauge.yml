- type: entity
  id: ShellShotgun12_gaugeImprovised
  name: '自制霰弹枪子弹（12号口径） | improvised shotgun shell (12 gauge)'
  description: '一种自制霰弹枪子弹，能射出令人剧痛的玻璃碎片。其散射范围过于宽泛，连谷仓的宽阔侧面都无法命中。 | A homemade shotgun shell that shoots painful glass shrapnel. The spread is so wide that it couldn''t hit the broad side of a barn.'
  parent: BaseShellShotgun12_gauge
  components:
  - type: Tag
    tags:
    - Cartridge
    - ShellShotgun12_gaugeBuckshot
    - ShellShotgun12_gaugeLight
  - type: Sprite
    layers:
      - state: improvised
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Construction
    graph: ImprovisedShotgunShellGraph
    node: shell
  - type: CartridgeAmmo
    proto: Pellet12_gaugeImprovisedSpread
  - type: SpentAmmoVisuals
    state: "improvised"

