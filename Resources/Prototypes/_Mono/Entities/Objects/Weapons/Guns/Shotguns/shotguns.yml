- type: entity
  name: '大铅弹（4号径） | Big Leady (4 gauge)'
  parent: [BaseWeaponShotgun, BaseGunWieldable]
  id: WeaponShotgunBigLeady
  description: 一把大型4号（23x75毫米）猎枪，用来杀死任何低于自动加农炮口径无法杀死的目标。
  components: # intend for BigLeady to have tighter choke for slower fire rate and/or manual cycling
  - type: Item
    size: Normal
    shape:
    - 0,0,4,0
    sprite: _Mono/Objects/Weapons/Guns/Shotguns/BigLeady_inhands_64x.rsi # Frontier: add _Mono prefix
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Shotguns/BigLeady.rsi
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Shotguns/BigLeady.rsi
  - type: GunRequiresWield #remove when inaccuracy on spreads is fixed
  - type: Gun
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/bigshotgun_fire.ogg
    #fireRate: 1 # Goobstation
  - type: Tag
    tags:
    - WeaponShotgunBigLeady
  - type: BallisticAmmoProvider # Goobstation
    autoCycle: false
    whitelist:
      tags:
      - ShellShotgun23x75mmBuckshot
    capacity: 6
    proto: ShellShotgun23x75mmBuckshot
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
  - type: StaticPrice
    price: 5000
    vendPrice: 42300

- type: entity
  name: '大块头乔尼（四号径） | Big Johnny (4 gauge)'
  parent: [BaseWeaponShotgun, BaseGunWieldable]
  id: WeaponShotgunBigJohnny
  description: 一把巨型4号口径霰弹枪，专为消灭自动炮以下任何口径无法应对的目标而生。这款武器配备多种战术配件，专为近战设计，但代价是弹药容量较低。
  components: # intend for BigLeady to have tighter choke for slower fire rate and/or manual cycling
  - type: Item
    size: Normal
    shape:
    - 0,0,4,0
    sprite: _Mono/Objects/Weapons/Guns/Shotguns/BigJohnny_inhands_64x.rsi
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Shotguns/BigJohnny.rsi
    layers:
    - state: icon
    - map: ["opticAttachment"]
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Shotguns/BigJohnny.rsi
  - type: GunRequiresWield #remove when inaccuracy on spreads is fixed
  - type: Gun
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/bigshotgun_fire.ogg
    #fireRate: 1 # Goobstation
  - type: GunSpreadModifier
    spread: 0.7
  - type: Tag
    tags:
    - WeaponShotgunBigLeady
  - type: BallisticAmmoProvider # Goobstation
    autoCycle: true
    whitelist:
      tags:
      - ShellShotgun23x75mmBuckshot
    capacity: 3
    proto: ShellShotgun23x75mmBuckshot
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
  - type: StaticPrice
    price: 5000
    vendPrice: 42300
  - type: LaserPointer
    targetedColor: "#FF0000"
    defaultColor: "#FF0000"
  # Attachment slop
  - type: ItemSlots
    slots:
      attachment_optic:
        insertSound: /Audio/Items/screwdriver2.ogg
        ejectSound: /Audio/Items/screwdriver2.ogg
        startingItem: GunAttachmentOpticErebus2x
        priority: 0
        whitelist:
          tags:
          - MonoOpticErebusRailmount
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
      attachment_optic: !type:ContainerSlot
  - type: ESAttachableGun
    slots:
    - name: es-gun-attachments-slot-name-optic
      containerId: attachment_optic
      whitelist:
        tags:
        - MonoOpticErebusRailmount
  - type: ActivatableUI
    key: enum.ESAttachableGunUiKey.Key
    verbOnly: true
    verbText: es-gun-attachments-verb-text
  - type: UserInterface
    interfaces:
      enum.ESAttachableGunUiKey.Key:
        type: ESGunAttachmentBui
  - type: Appearance
  - type: ESItemMapper
    mappings:
      opticAttachment:
      - containerId: attachment_optic
        state: optic2x
        whitelist:
          tags:
          - MonoOptic2x
      - containerId: attachment_optic
        state: optic4x
        whitelist:
          tags:
          - MonoOptic4x
      - containerId: attachment_optic
        state: optic8x
        whitelist:
          tags:
          - MonoOptic8x

