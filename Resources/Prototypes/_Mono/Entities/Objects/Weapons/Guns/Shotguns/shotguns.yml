- type: entity
  name: GS-004-A 杰克 (四号径)霰弹枪
  parent: [BaseItem, BaseGunWieldable]
  id: WeaponShotgunJack
  description: 一把极其重的自动火力23x75毫米霰弹枪，从弹带和专用背包上上弹。
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Shotguns/jack.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Huge
    sprite: _Mono/Objects/Weapons/Guns/Shotguns/jack_inhands_32x.rsi
    shape:
    - 0,0,4,3
  - type: Wieldable
  - type: GunRequiresWield
  - type: WieldDelay
    baseDelay: 2
    modifiedDelay: 2
    preventFiring: true
  - type: Gun
    minAngle: 35 # Might need increasing for slugs.
    maxAngle: 60
    angleIncrease: 4
    angleDecay: 16
    fireRate: 2
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/bigshotgun_fire.ogg
  - type: GunSpreadModifier
    spread: 1.5
  - type: LaserPointer
    targetedColor: "#FF0000"
    defaultColor: "#FF0000"
  - type: AmmoCounter
  - type: StaticPrice
    price: 5000
    vendPrice: 42300
  - type: ItemTax
    taxAccounts:
      nfsd: 0.2
  - type: Appearance
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Shotguns/jack_inhands_32x.rsi
    slots:
    - Back
    - suitStorage
  - type: ClothingSlotAmmoProvider
    targetSlot: BACK
    providerWhitelist:
      tags:
      - JackShotgunBackpack
  - type: Tag
    tags:
    - WeaponShotgunJack


- type: entity
  name: UW12-B Helepolis (12 gauge)霰弹枪
