# FACTIONLATHE ONLY TECH DISKS - #454545

- type: entity
  parent: TechDiskBase
  id: TechDiskEnergyWeapons
  name: '前断代纪元 能量武器派系技术盘 | pre-fracture energy weapon faction tech disk'
  description: '可为阵营科技工厂服务器配方添加能量武器与护盾的技术磁盘。 | A disk capable of adding energy weapons and shields to a server''s recipes, for faction techfabs.'
  components:
  - type: Sprite
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base"]
      color: "#d4d4d4"
    - state: label
    - state: protect
    - state: holo
      shader: unshaded
  - type: TechnologyDisk
    recipes:
    - EnergySwordRogue
    - EnergyDaggerRogue
    - HeavyBallisticShield
    - TelescopicShield

