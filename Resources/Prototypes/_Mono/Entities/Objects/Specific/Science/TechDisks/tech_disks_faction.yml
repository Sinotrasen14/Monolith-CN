# FACTIONLATHE ONLY TECH DISKS - #454545

- type: entity
  parent: TechDiskBase
  id: TechDiskSynthalloy
  name: '前断代纪元 合成合金派系技术磁盘 | pre-fracture synthalloy faction tech disk'
  description: '能够为服务器配方添加早期合成合金生产工艺的磁盘。效率低于现代合成合金生产方法。 | A disk capable of adding early synthalloy production processes to a server''s recipes. Less efficient than modern synthalloy methods.'
  components:
  - type: Sprite
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base"]
      color: "#d4d4d4"
    - state: label
    - state: protect
    - state: dna
      shader: unshaded
  - type: TechnologyDisk
    recipes:
    - SynthalloyProductionTechDisk

- type: entity
  parent: TechDiskBase
  id: TechDiskEnergyWeapons
  name: '前断代纪元 能量武器派系技术盘 | pre-fracture energy weapon faction tech disk'
  description: '可为阵营科技工厂服务器配方添加能量武器与护盾的技术磁盘。 | A disk capable of adding energy weapons and shields to a server''s recipes, for faction techfabs.'
  components:
  - type: Sprite
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base"]
      color: "#d4d4d4"
    - state: label
    - state: protect
    - state: holo
      shader: unshaded
  - type: TechnologyDisk
    recipes:
    - EnergySwordRogue
    - EnergyDaggerRogue
    - EnergyShieldRogue

