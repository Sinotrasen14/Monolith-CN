# S2 Mechas
- type: entity
  id: BaseAFInterceptor
  parent: [ BaseMech, LightMechMount, BaseRestrictedContraband ]
  abstract: true
  categories: [ HideSpawnMenu ]
  name: 'AF-28「阔剑」机甲 | AF-28 "Broadsword"'
  description: '首批专用装甲型号之一，用于攻击轻型目标及其他装甲机架。 | One of the first purpose built Armored Frames, made to engage light targets and other Armored Frames.'
  components:
  - type: Fixtures
    fixtures: # Custom hitbox
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.9
        density: 300
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
        - MachineLayer
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _Mono/Objects/Specific/Mech/mechaS2.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base" ]
      state: broadsword
    - map: ["enum.PaperLabelVisuals.Layer"]
      sprite: Structures/Storage/Crates/labels.rsi
      state: paper
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
  - type: Mech
    baseState: broadsword
    openState: broadsword-open
    brokenState: broadsword-broken
    mechToPilotDamageMultiplier: 0
    maxEquipmentAmount: 3
    airtight: true
    maxIntegrity: 2400
    pilotWhitelist:
      components:
        - HumanoidAppearance
        - BorgChassis
    zoom: 1.5, 1.5
  - type: MeleeWeapon
    hidden: true
    attackRate: 1
    damage:
      types:
        Blunt: 25
        Structural: 260
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 4800
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: start
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: RadarConsole
    maxRange: 512
    followEntity: true
  - type: Appearance
  - type: GenericVisualizer
  # EXTREMELY slow in gravity. Only really good to taxi, and that's about it.
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.2
    baseSprintSpeed: 1
    baseWeightlessModifier: 40
  - type: RadarBlip
    radarColor: "#E3E3E3"
    scale: 3
    requireNoGrid: true
    shape: square
  - type: Damageable
    damageModifierSet: HeavyArmorNT
  - type: Repairable
    fuelCost: 40
    doAfterDelay: 30
  - type: StaticPrice
    price: 3000
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - Broadsword
  - type: Prying
    pryPowered: true
    speedModifier: 3
    useSound:
      path: /Audio/Items/jaws_pry.ogg

- type: entity
  id: AFInterceptor
  parent: BaseAFInterceptor
  components:
  - type: CanMoveInAir
  - type: MovementAlwaysTouching

- type: entity
  id: AFInterceptorBattery
  parent: AFInterceptor
  suffix: Battery
  components:
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - PowerCageHigh

- type: entity
  id: AFInterceptorM
  parent: [LightMultiroleMount, AFInterceptor]
  name: 'AF-28-M「长戟」机甲 | AF-28-M "Halberd"'
  description: '基于阔剑级改造的长戟级，通过削弱装甲与航速换取了重型武器挂载能力。 | A modification of the Broadsword, the Halberd sacrifices armor and speed for heavier weapon mounts.'
  components:
  - type: Mech
    baseState: broadsword
    openState: broadsword-open
    brokenState: broadsword-broken
    mechToPilotDamageMultiplier: 0
    maxEquipmentAmount: 3
    airtight: true
    maxIntegrity: 1800
    pilotWhitelist:
      components:
        - HumanoidAppearance
        - BorgChassis
    zoom: 1.75, 1.75
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3600
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: start
      - !type:DoActsBehavior
        acts: ["Destruction"]
  # EXTREMELY slow in gravity. Only really good to taxi, and that's about it.
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.2
    baseSprintSpeed: 1
    baseWeightlessModifier: 35
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - Halberd
    - MilitaryMechBounty


- type: entity
  id: AFInterceptorG
  parent: [LightMultiroleMount, AFInterceptor]
  name: 'AF-28-G「军刀」机甲 | AF-28-G "Sabre"'
  description: '基于阔剑的改进型号，军刀取消了喷气背包与太空防护盾功能以适配行星环境。配备两个挂载点，可搭载轻型或中型武器。 | A modification of the Broadsword, the Sabre sacrifices it''s jetpack and spaceproof shielding to function on planets. Has two hardpoints, which can carry Light or Medium hardpoints.'
  components:
  - type: Mech
    baseState: broadsword
    openState: broadsword-open
    brokenState: broadsword-broken
    mechToPilotDamageMultiplier: 0
    maxEquipmentAmount: 3
    airtight: false
    maxIntegrity: 1000
    pilotWhitelist:
      components:
        - HumanoidAppearance
        - BorgChassis
    zoom: 1.15, 1.15 # its a ground mech.
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 2000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: start
      - !type:DoActsBehavior
        acts: ["Destruction"]
  # Terrible radar, mostly good for navigating planets
  - type: RadarConsole
    maxRange: 256
    followEntity: true
  - type: DetectionRangeMultiplier
    infraredMultiplier: 0.5 # from 1
    visualMultiplier: 3 # from 4
  # Only ground-based mecha so far. Don't use it in space. Can't move in space.
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 6
    baseWeightlessModifier: 0.3 # Barely usable in space.
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - Sabre
    - MilitaryMechBounty

