- type: entity
  parent: BaseItem
  abstract: true
  id: BaseFactionWarDeclarator
  name: 战争宣告器
  description: 一个用来在该地区宣布敌对行动的装置。如果双方都启动它，将会宣布全面战争。
  components:
    - type: Sprite
      sprite: Objects/Devices/declaration_of_war.rsi
      layers:
        - state: declarator
    - type: Item
    - type: UseDelay
      delay: 0.5
    - type: FactionWarDeclarator

- type: entity
  parent: BaseFactionWarDeclarator
  id: WarDeclaratorTsf
  name: TSFMC 战争宣告器
  components:
  - type: FactionWarDeclarator
    faction: TSF
    warDeclarationMessage: war-declaration-tsfmc

- type: entity
  parent: BaseFactionWarDeclarator
  id: WarDeclaratorPdv
  name: PDV 战争宣告器
  components:
  - type: FactionWarDeclarator
    faction: PDV
    warDeclarationMessage: war-declaration-pdv
