- type: entity
  parent: BaseSecurityPDA
  id: TsfEngiPDA
  name: 'TSFMC工程师掌上电脑 | TSFMC engineer PDA'
  description: '标准TSFMC工程师个人计算机。 | A standard TSFMC personal computer.'
  components:
  - type: Pda
    id: TsfEngiIDCard
    bookSlot: # Frontier
      startingItem: HyperlinkBookNfsdSop
      priority: -2
      whitelist:
        tags:
        - BookSpaceLaw
        - BookNfsdSop
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-lifesupporttech
  - type: PdaBorderColor
    borderColor: "#edb015"
    accentHColor: "#ed2715"
  - type: Icon
    state: pda-lifesupporttech
  - type: Geiger # Mono
    showExamine: true
    showControl: true
    isEnabled: true
    attachedToSuit: true # Mono

