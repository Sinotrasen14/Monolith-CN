# TSF

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonSandevistanTSF
  name: TSF 自动外科医生 (WJY-21X sandevistan)
  description: 用逆向工程的MMC Sandevistan替换心脏。降温速度没有真的那么快。
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    targetOrgan: Heart
    newPartProto: OrganHeartTSFSandevistan

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonSandevistanTSFFlatpack
  name: TSF 自动外科医生 (WJY-21X sandevistan) 组装包
  description: 用于组装 TSF 自动外科医生的平板包装。
  components:
  - type: Flatpack
    entity: AutosurgeonSandevistanTSF
  - type: StaticPrice
    price: 15000
  - type: Sprite
    layers:
    - state: medical_lathe

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonShuntTSF
  name: TSF 自动外科医生 (KR-22 shunt device)
  description: 用一个高度实验性的分流装置替换心脏。那可真是些可怕的技术。
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    targetOrgan: Heart
    newPartProto: OrganHeartTSFShunt

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonShuntTSFFlatpack
  name: TSF 自动外科医生 (KR-22 shunt device) 组装包
  description: 用于组装 TSF 自动外科医生的平板包装。
  components:
  - type: Flatpack
    entity: AutosurgeonShuntTSF
  - type: StaticPrice
    price: 50000
  - type: Sprite
    layers:
    - state: medical_lathe

# PDV

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonIASPDV
  name: PDV 自动外科医生 (LS-210 IAS)
  description: 用先进的内部空气系统替换肺部。能够过滤掉大部分大气气体，并大大提高呼吸效率。
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    targetOrgan: Lungs
    newPartProto: OrganInternalAirSystem

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonIASPDVFlatpack
  name: PDV 自动外科医生 (LS-210 IAS) 组装包
  description: A flatpack used for constructing a PDV autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonIASPDV
  - type: StaticPrice
    price: 4000
  - type: Sprite
    layers:
    - state: medical_lathe


# Dermal armor

- type: entity
  parent: BaseAutosurgeonMieyo
  id: AutosurgeonDermalArmorPDV
  name: PDV 自动外科医生 (E-SAPI dermal armor)
  description: 在体内植入一组 E-SAPI 装甲板。让你更容易受到热量和电击的伤害，但能让你更抗子弹。
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    componentsToUser:
    - type: DamageProtectionBuff
      modifiers:
        dermal:
          id: DermalArmorCybernetics
          coefficients:
            Shock: 1.25
            Heat: 1.1
            Piercing: 0.85
            Blunt: 0.9
            Slash: 0.9

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonDermalArmorPDVFlatpack
  name: PDV 自动外科医生 (E-SAPI dermal armor) 组装包
  description: A flatpack used for constructing a PDV autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonDermalArmorPDV
  - type: StaticPrice
    price: 2500
  - type: Sprite
    layers:
    - state: medical_lathe

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonAdvHeartPDV
  name: PDV 自动外科医生 (VV/KE prosthetic heart)
  description: 用一个更强大的心脏替换。可以让你更快处理试剂，承受更多伤害而不倒下，但会降低耐力，并且处理药物的速度变慢。
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    targetOrgan: Heart
    newPartProto: OrganPDVAdvancedHeart

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonAdvHeartPDVFlatpack
  name: PDV 自动外科医生 (VV/KE prosthetic heart) 组装包
  description: A flatpack used for constructing a PDV autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonAdvHeartPDV
  - type: StaticPrice
    price: 3000
  - type: Sprite
    layers:
    - state: medical_lathe

