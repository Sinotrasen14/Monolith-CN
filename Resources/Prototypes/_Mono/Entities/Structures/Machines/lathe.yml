- type: entity
  id: BaseLatheAssembler
  parent: BaseLathe
  abstract: true
  name: lathe
  components:
  - type: ItemSlots
    slots:
      beaker_slot:
        name: lathe-component-output-slot-beaker-name
        whitelist:
          components:
          - DrainableSolution
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      entity_storage: !type:Container
      beaker_slot: !type:ContainerSlot
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_parts
    - machine_board
    - entity_storage
  - type: EntityStorage
    capacity: 75
  - type: ExtendDescription
    descriptionList:
    - description: Insert components for recipes by placing them on top of the lathe, then "open / close" inside its right-click menu.
      color: "#4f94ad"
      requireDetailRange: true

