- type: entity
  id: TSFNChengduComputer
  parent: BaseCarrierComputer
  name: TSFN 成都内部机库控制台
  description: 使用成都内部机库的小型船厂，没有办法使用TSFMC的全部舰船名单。
  components:
  - type: ShipyardListing
    shuttles:
    - Ocelot
  - type: CompanyAccessReader
    requiredCompanies:
    - TSF

- type: entity
  id: JupiterCarrierComputer
  parent: BaseCarrierComputer
  name: '木星造船厂控制台 | jupiter shipyard console'
  description: 轻型造船厂，使用木星级内部机库，无法访问法厄同帝国全部舰船目录。
  components:
  - type: ShipyardListing
    shuttles:
    - Tethys
    - Layak
    - Scorpion
    - Bazalt
    - Gadfly
    - Ontos
  - type: Sprite
    sprite: _NF/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer_blackmarket
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: shipyard_pdv
    - map: ["computerLayerKeys"]
      state: telesci_key

- type: entity
  id: TSFCarrierComputerFujian
  parent: BaseCarrierComputer
  name: TSF 福建航母控制台
  components:
  - type: ShipyardListing
    shuttles:
    - ZephyrEC

- type: entity
  id: PDVMotleyAnneCarrierComputer
  parent: BaseCarrierComputer
  name: 杂色安妮造船厂控制台
  components:
  - type: ShipyardListing
    shuttles:
    - Snakelet
    - Inertia
    - Mock
  - type: Sprite
    sprite: _NF/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer_blackmarket
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: shipyard_blackmarket
    - map: ["computerLayerKeys"]
      state: blackmarket_key
