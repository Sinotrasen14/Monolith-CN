- type: entity
  id: JupiterCarrierComputer
  parent: BaseCarrierComputer
  name: '木星造船厂控制台 | jupiter shipyard console'
  description: 轻型造船厂，使用木星级内部机库，无法访问法厄同帝国全部舰船目录。
  components:
  - type: ShipyardListing
    shuttles:
    - Hazel
    - Tethys
    - Eris
    - Layak
    - Metis
    - Kalisto
    - Prowler
  - type: Sprite
    sprite: _NF/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer_blackmarket
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: shipyard_pdv
    - map: ["computerLayerKeys"]
      state: telesci_key


