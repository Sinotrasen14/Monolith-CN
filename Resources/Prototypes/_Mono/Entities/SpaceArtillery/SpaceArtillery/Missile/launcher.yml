# ASM-501 Smerchs

- type: entity
  id: WeaponTurretASM501
  name: 'ASM-501鱼雷吊舱'
  parent: BallisticArtilleryUnanchorable
  description: '巡洋舰鱼雷发射器。可发射重型鱼雷对大型舰船与空间站实施高伤害打击。支持远程激活或连接至全局控制系统。 | A cruiser torpedo launcher. Fires heavy torpedoes for high-damage strikes against large ships and stations. Can be remotely activated or linked to a GCS.'
  components:
  - type: StaticPrice
    price: 5000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/vanyk-MK2.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: Battery
    maxCharge: 40000
    startingCharge: 40000
  - type: ExaminableBattery
  - type: WirelessNetworkConnection
    range: 500
  - type: Gun
    fireRate: 0.1
    shootThermalSignature: 32000000 # ~5.6km
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: SpaceArtillery
    powerChargeRate: 250
    powerUsePassive: 200
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 60
  - type: Actions
  - type: ProjectileBatteryAmmoProvider
    proto: ShipMissileASM501
    fireCost: 350
  - type: RadarBlip
    radarColor: "#FCBA03"
    scale: 2.5
  - type: ShipGunType
    shipType: Missile
  - type: ShipGunClass
    shipClass: Medium

# Corporate War Era - Syndicate

- type: entity
  id: WeaponTurretSerpentMissile
  name: 蛇式鱼雷发射器
  parent:
  - BallisticArtilleryUnanchorable
  - BallisticArtilleryTier3HP
  description: 这是公司战争期间辛迪加开发的一种轻型鱼雷发射器，使用了类似于巨蟒号的自装弹系统。
  components:
  - type: StaticPrice
    price: 5000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/serpent.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: Battery
    maxCharge: 40000
    startingCharge: 40000
  - type: ExaminableBattery
  - type: WirelessNetworkConnection
    range: 500
  - type: Gun
    fireRate: 0.5
    recoil: 10
    shootThermalSignature: 32000000 # ~5.6km
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/launcher_alt.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: SpaceArtillery
    powerChargeRate: 250
    powerUsePassive: 200
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 60
  - type: Actions
  - type: ProjectileBatteryAmmoProvider
    proto: ShipMissileSerpent
    fireCost: 350
  - type: RadarBlip
    radarColor: "#FCBA03"
    scale: 2.75
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Missile
  - type: ShipGunClass
    shipClass: Heavy
  - type: ShipRepairable
    repairTime: 30
    repairCost: 120

# Pre-Fracture

