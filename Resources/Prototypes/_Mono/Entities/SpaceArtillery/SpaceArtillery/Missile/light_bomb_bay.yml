- type: entity
  id: WeaponTurretLightMunitionsBay
  name: GPOB-L 轻型弹药舱
  parent:
  - BallisticArtilleryUnanchorableCartridge
  - BallisticArtilleryTier3HP
  description: 一个相对较小的装甲弹药舱，最多可以容纳两个轻型弹药包。通常出现在轻型宇宙飞船上，尤其是轰炸机，并提供一种有限的方式来攻击远超自身重量级的目标。
  components:
  - type: StaticPrice
    price: 1000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/lightmunitionsbay.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: AmmoCounter
  - type: WirelessNetworkConnection
    range: 700
  - type: GunSignalControl
  - type: Gun
    projectileSpeed: 50
    fireRate: 0.8
    recoil: 5
    shootThermalSignature: 8000000 # ~2.8km
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: SpaceArtillery
    powerChargeRate: 50
    powerUsePassive: 75
    powerUseActive: 0
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - LightFighterOrdinance
    capacity: 2
    soundInsert:
      path: /Audio/Items/rped.ogg
  - type: Actions
  - type: RadarBlip
    radarColor: "#ff9d00"
    scale: 0.7
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Missile
  - type: ShipGunClass
    shipClass: Medium
  - type: ShipRepairable
    repairTime: 25
    repairCost: 100
