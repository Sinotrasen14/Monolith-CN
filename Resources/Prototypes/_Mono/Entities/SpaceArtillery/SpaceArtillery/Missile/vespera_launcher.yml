- type: entity
  id: WeaponTurretVespera
  name: ADMP-50 维斯佩拉导弹架
  parent:
  - BallisticArtilleryMagazine
  - BallisticArtilleryTier2HP
  description: 由Aetherion Dynamics制造的快速射击群体导弹架。用制导弹头覆盖目标以压制防御。弹药有限，但非常致命。可远程激活或连接到地面控制系统（GCS）。
  components:
  - type: StaticPrice
    price: 1500
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/vespera.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: WirelessNetworkConnection
    range: 500
  - type: GunSignalControl
  - type: Gun
    fireRate: 16
    recoil: 1
    minAngle: 4
    maxAngle: 35
    burstCooldown: 20
    burstFireRate: 16
    shotsPerBurst: 13
    selectedMode: Burst
    availableModes: Burst
    shootThermalSignature: 2000000 # ~4.9km if firing continuously
    soundGunshot:
      collection: ShipGunGenericMissile
    soundEmpty:
      path: /Audio/Weapons/click.ogg
  - type: SpaceArtillery
    powerChargeRate: 200
    powerUsePassive: 750
    powerUseActive: 0
  - type: Actions
  - type: MagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MissileMagazine50mmHE
        insertSound: /Audio/Weapons/Guns/MagIn/hpistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MissileMagazine50mm
        whitelistFailPopup: gun-magazine-whitelist-fail
  - type: RadarBlip
    radarColor: "#FCBA03"
    scale: 2
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Missile
  - type: ShipGunClass
    shipClass: Medium
  - type: ShipRepairable
    repairTime: 30
    repairCost: 100
  - type: HardpointAnchorableOnly
    class: Missile
    size: Medium
