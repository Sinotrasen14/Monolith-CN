- type: entity
  id: WeaponTurretASM220
  name: ASM-220 三叉戟-鱼雷架
  parent:
  - BallisticArtilleryUnanchorableCartridge
  - BallisticArtilleryTier4HP
  description: 一种为巡洋舰设计的重型内置鱼雷架，依赖手动装填，通常在港口进行。尽管如此，它拥有该区域最大的导弹。
  components:
  - type: StaticPrice
    price: 10000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/asm220.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: AmmoCounter
  - type: WirelessNetworkConnection
    range: 500
  - type: Gun
    fireRate: 0.1
    recoil: 10
    shootThermalSignature: 16000000 # 4000m after firing
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/towfire.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: SpaceArtillery
    powerChargeRate: 500
    powerUsePassive: 2500
    powerUseActive: 0
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - Asm220Torpedo
    capacity: 4
    soundInsert:
      path: /Audio/Items/rped.ogg
  - type: Actions
  - type: RadarBlip
    radarColor: "#ff9d00"
    scale: 0.95
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Missile
  - type: ShipGunClass
    shipClass: Medium
  - type: ShipRepairable
    repairTime: 30
    repairCost: 100

- type: entity
  id: WeaponTurretASM220Station
  suffix: Supercap/Station, Infinite HE, I'll kill you if you put this on a normal capital.
  parent:
  - WeaponTurretASM220
  description: 一种为巡洋舰设计的重型内置鱼雷架，需要手动装填，通常在港口进行。尽管如此，它配备了该区域最大的导弹。这一型号还连接到一个系统，可以自动从主力舰或基地储备中装填垂直发射系统（VLS）。
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - Asm220Torpedo
    capacity: 4
    soundInsert:
      path: /Audio/Items/rped.ogg
    infiniteUnspawned: True
    proto: Asm220TorpedoHE
  - type: ShipGunClass
    shipClass: Heavy
