- type: entity
  id: WeaponTurretVanyk
  name: ASM-150 “Vanyk” 导弹吊舱
  parent:
  - BallisticArtilleryMagazine
  - BallisticArtilleryTier2HP
  description: 由Aetherion Dynamics制造的护航导弹舱。发射150毫米制导导弹，用于基本的舰船对舰作战和区域封锁。使用内置自动装载器代替导架，增加了容量但降低了射速。可以远程激活或连接到GCS。
  components:
  - type: StaticPrice
    price: 4000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/vanyk.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: WirelessNetworkConnection
    range: 500
  - type: GunSignalControl
  - type: Gun
    fireRate: 0.8
    recoil: 5
    minAngle: 0
    maxAngle: 0
    shootThermalSignature: 8000000 # ~5km if firing continuously
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/launcher_alt.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: Actions
  - type: SpaceArtillery
    powerChargeRate: 350
    powerUsePassive: 600
    powerUseActive: 0
  - type: MagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: VanykMagazine
        insertSound: /Audio/Weapons/Guns/MagIn/hpistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - VanykMagazine
        whitelistFailPopup: gun-magazine-whitelist-fail
  - type: RadarBlip
    radarColor: "#FCBA03"
    scale: 1.5
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Missile
  - type: ShipGunClass
    shipClass: Medium
  - type: ShipRepairable
    repairTime: 30
    repairCost: 100
  - type: HardpointAnchorableOnly
    class: Missile
    size: Light
