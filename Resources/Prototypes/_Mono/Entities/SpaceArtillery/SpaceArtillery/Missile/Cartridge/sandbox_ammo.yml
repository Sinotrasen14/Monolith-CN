- type: entity
  id: SandboxNuclearMissile
  name: SS-N-40 “亚特兰特”核巡航导弹
  description: 一种配备多千吨级核弹头的高速巡航导弹，能够一击摧毁任何舰船。几乎无法阻挡，而且在雷达上看起来和普通的8K30完全一样。这是一种大规模杀伤性武器，世界的毁灭者。希望你用不上它。
  parent: BaseGrenade
  components:
  - type: Tag
    tags:
    - SandboxCruiseMissiles
  - type: Item
    size: Huge
  - type: CartridgeAmmo
    proto: ShipMissileSandboxNuke
