  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/sandbox.rsi
    layers:
    - state: atlant
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: MultiHandedItem
  - type: HeldSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
  - type: Explosive
    explosionType: HardBomb
    maxIntensity: 1500
    intensitySlope: 20
    totalIntensity: 3000
  - type: ExplodeOnTrigger
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
