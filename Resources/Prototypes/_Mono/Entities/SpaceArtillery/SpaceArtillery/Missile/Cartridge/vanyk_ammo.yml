- type: entity
  id: VanykMagazine
  name: "Vanyk 150毫米高爆导弹自动装弹机"
  parent: [BaseItem, RecyclableItemSteelTiny]
  components:
  - type: Tag
    tags:
    - VanykMagazine
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    proto: VanykCartridge
    capacity: 30
    mayTransfer: true
    whitelist:
      tags:
      - VanykCartridge
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Boxes/generic_shipgun_box.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance

- type: entity
  id: VanquisherMagazine
  name: "征服者150毫米高爆导弹自动装填机"
  parent: [BaseItem, RecyclableItemSteelTiny]
  components:
  - type: Tag
    tags:
    - VanquisherMagazine
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    proto: VanykCartridgeUnguided
    capacity: 288
    mayTransfer: true
    whitelist:
      tags:
      - VanykCartridgeUnguided
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Boxes/generic_shipgun_box.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance

- type: entity
  id: VanquisherMagazineInfinite
  parent: VanquisherMagazine
  components:
  - type: BallisticAmmoProvider
    infiniteUnspawned: true
    proto: VanykCartridgeUnguided
    capacity: 288
    mayTransfer: true
    whitelist:
      tags:
      - VanykCartridgeUnguided

- type: entity
  id: VanykCartridge
  name: 150mm HEAT 导弹
  description: 在 Vanyk 中使用的一枚 ASM-150 高爆反坦克导弹。
  parent: BaseGrenade
  components:
  - type: Tag
    tags:
    - VanykCartridge
    - 150mmShell # intentional, silly + interesting hidden feature stemming from funny shared caliber
  - type: Item
    size: Huge
  - type: CartridgeAmmo
    proto: ShipMissileASM150
    deleteOnSpawn: true
    muzzleFlash: null
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/generic_cartridges.rsi
    layers:
    - state: vanyk
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
  - type: Explosive
    explosionType: Default
    maxIntensity: 100
    intensitySlope: 3
    totalIntensity: 6
  - type: ExplodeOnTrigger
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic

- type: entity
  id: VanykCartridgeUnguided
  name: 150mm HEAT 无制导导弹
  parent: VanykCartridge
  components:
  - type: Tag
    tags:
    - VanykCartridge
    - VanykCartridgeUnguided
    - 150mmShell
  - type: Item
    size: Huge
  - type: CartridgeAmmo
    proto: ShipMissileASM150Unguided
    deleteOnSpawn: true
