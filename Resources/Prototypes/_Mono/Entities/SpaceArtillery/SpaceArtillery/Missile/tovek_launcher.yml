- type: entity
  id: WeaponTurretTovek
  name: ADMX-250 TOVEK 导弹吊舱
  parent: BallisticArtilleryCartridge
  description: 由Aetherion Dynamics制造的250毫米导弹吊舱。发射250毫米弹头，远程摧毁敌舰。可以远程激活或连接到GCS。
  components:
  - type: StaticPrice
    price: 10000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/tovek.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: WirelessNetworkConnection
    range: 500
  - type: GunSignalControl
  - type: Gun
    fireRate: 0.2
    recoil: 5
    shootThermalSignature: 8000000 # ~2828m
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/towfire.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: SpaceArtillery
    powerChargeRate: 500
    powerUsePassive: 2500
    powerUseActive: 0
  - type: Actions
  - type: RadarBlip
    radarColor: "#035EFC"
    scale: 2
    visibleFromOtherGrids: true
  - type: BallisticAmmoProvider
    infiniteUnspawned: true
    whitelist:
      tags:
      - TovekCartridge
    capacity: 2
    proto: TovekCartridge
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: ShipGunType
    shipType: Missile
  - type: ShipGunClass
    shipClass: Medium
  - type: ShipRepairable
    repairTime: 35
    repairCost: 120
  - type: HardpointAnchorableOnly
    class: Missile
    size: Medium
