# L85

- type: entity
  id: WeaponTurretL85Autocannon
  name: L85 20mm 自动炮
  parent:
  - BallisticArtilleryMagazine
  - BallisticArtilleryTier1HP
  suffix: Small, T1
  description: 一款轻型20毫米弹道自动炮，设计用于快速火力点防御和压制近距离的小型目标。便宜、轻便，可以远程激活或连接到地面控制站（GCS）。
  components:
  - type: StaticPrice
    price: 250
  - type: Sprite
    offset: -0.03,0
    sprite: _Mono/Objects/ShuttleWeapons/L85.rsi
    layers:
    - state: icon
  - type: Appearance
  - type: FireControlRotate
  - type: AutoShootGun
  - type: GunSignalControl
  - type: WirelessNetworkConnection
    range: 700
  - type: DeviceLinkSink
    ports:
    - Toggle
  - type: Gun
    damageModifier: 5
    fireRate: 10
    recoil: 5 # 1/5x
    projectileSpeed: 192
    minAngle: 0
    maxAngle: 5
    shootThermalSignature: 10000 # relatively low for a shipgun, ~693m signature if firing continuously
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/vulcan.ogg
      params:
        variation: 0.10
        pitch: 1.10
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: SpaceArtillery
    powerChargeRate: 100
    powerUsePassive: 100
  - type: Actions
  - type: CombatMode
    isInCombatMode: true
  - type: Airtight
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine20mm
        insertSound: /Audio/Weapons/Guns/MagIn/hpistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine20mm
        whitelistFailPopup: gun-magazine-whitelist-fail
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 7500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: RadiationBlocker
    resistance: 8
  - type: RadarBlip
    radarColor: "#FF0000"
    scale: 1
    visibleFromOtherGrids: true
    gridConfig:
      color: "#FF0000"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-0.7,-0.7,0.7,0.7"
  - type: ShipGunType
    shipType: Ballistic
  - type: ShipGunClass
    shipClass: Light
  - type: ShipRepairable
    repairTime: 10
    repairCost: 20
  - type: HardpointAnchorableOnly
    class: Ballistic
    size: Light

# Draupnir

