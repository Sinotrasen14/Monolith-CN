  - type: DeviceLinkSink
    ports:
    - Toggle
  - type: Gun
    damageModifier: 1
    fireRate: 25
    recoil: 5 # 1/5x
    projectileSpeed: 160
    minAngle: 0
    maxAngle: 4
    shootThermalSignature: 100000 # ~4.5km if firing continuously
    soundGunshot:
