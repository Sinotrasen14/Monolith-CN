# HADES 305mm

- type: entity
  id: WeaponTurretHades
  name: 'HADES 305mm 加农炮'
  parent: BallisticArtilleryUnanchorable
  description: '本区域最大的武器之一。其威力仅能由M381等质量加速器相匹敌。 | One of the largest chemical-based kinetic weapons in the sector. Its power is only rivaled by mass drivers such as the M381.'
  components:
  - type: StaticPrice
    price: 30000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/hades.rsi
    layers:
    - state: space_artillery
    scale: 1.15, 1.15
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: Battery
    maxCharge: 12000
    startingCharge: 12000
  - type: ExaminableBattery
  - type: WirelessNetworkConnection
    range: 500
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-0.6,0.6,0.6"
        density: 1500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Gun
    projectileSpeed: 350
    minAngle: 0
    maxAngle: 0
    fireRate: 0.2
    burstCooldown: 10
    burstFireRate: 2
    shotsPerBurst: 2
    selectedMode: Burst
    availableModes: Burst
    shootThermalSignature: 160000000 # now all of china knows you're here (12.6km)
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/cannon.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 12000
  - type: SpaceArtillery
    powerChargeRate: 12000
    powerUsePassive: 1500
    powerUseActive: 0
  - type: Actions
  - type: ProjectileBatteryAmmoProvider
    proto: ShipHadesProjectile
    fireCost: 6000
  - type: RadarBlip
    radarColor: "#FF0000"
    scale: 2.5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: ShipGunType
    shipType: Ballistic
  - type: ShipGunClass
    shipClass: Superheavy

# Corporate War Era - Syndicate

# Adder Scattercannon

- type: entity
  id: WeaponTurretAdderScattercannon
  name: 蝰蛇散弹炮
  suffix: Small, T1
  parent:
  - BallisticArtillery
  - BallisticArtilleryTier1HP
  description: 一把大型双管散弹炮，发射罐装弹来粉碎任何来袭的导弹或潜在的登船者。使用类似蟒蛇手枪的自装填机制。
  components:
  - type: StaticPrice
    price: 250
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/adder.rsi
    layers:
    - state: space_artillery
  - type: Battery
    maxCharge: 20000
    startingCharge: 20000
  - type: ExaminableBattery
  - type: Appearance
  - type: FireControlRotate
  - type: AutoShootGun
  - type: GunSignalControl
  - type: WirelessNetworkConnection
    range: 700
  - type: DeviceLinkSink
    ports:
    - Toggle
  - type: Gun
    fireRate: 5
    recoil: 10 # 2/5x
    projectileSpeed: 230
    minAngle: 0
    maxAngle: 5
    shootThermalSignature: 10000 # relatively low for a shipgun, ~693m signature if firing continuously
    soundGunshot:
      collection: ShipGunGenericSmall
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 550
  - type: SpaceArtillery
    powerChargeRate: 100
    powerUsePassive: 100
  - type: Actions
  - type: CombatMode
    isInCombatMode: true
  - type: Airtight
  - type: ProjectileBatteryAmmoProvider
    proto: AdderSpread
    fireCost: 15
  - type: RadiationBlocker
    resistance: 8
  - type: RadarBlip
    radarColor: "#FF0000"
    scale: 1
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Ballistic
  - type: ShipGunClass
    shipClass: Light
  - type: ShipRepairable
    repairTime: 10
    repairCost: 30

