- type: entity
  id: ShipTarnyxProjectile
  name: '塔尔尼克斯150mm 电磁脉冲弹 | TARNYX 150mm EMP projectile'
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 100
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/shells.rsi
    layers:
    - state: 150mmAP
  - type: Ammo
    muzzleFlash: null
  - type: ShipWeaponProjectile
  - type: RadarBlip
    radarColor: "#035EFC"
    scale: 1.5
    shape: circle
  - type: TimedDespawn
    lifetime: 5
  - type: PointLight
    color: "#FB00FF"
  - type: EmpOnTrigger
    range: 10
    energyConsumption: 500000
    disableDuration: 5.5

- type: entity
  id: 150mmEmpShell
  name: '150mm 电磁脉冲弹 | 150mm EMP shell'
  description: '一种化学推进的电磁脉冲炮弹，用于TARNYX等150mm 火炮。没什么特别之处。 | A chemically-propelled EMP shell, used in 150mm cannons such as the TARNYX. Nothing fancy.'
  parent: BaseGrenade
  components:
  - type: Tag
    tags:
    - 150mmShell
  - type: Item
    size: Huge
  - type: CartridgeAmmo
    proto: ShipTarnyxProjectile
    deleteOnSpawn: true
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/150mmtarnyx.rsi
    layers:
    - state: 150mm_emp
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: EmpDescription
    range: 10
    energyConsumption: 500000
    disableDuration: 5.5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
  - type: Explosive
    explosionType: Default
    maxIntensity: 100
    intensitySlope: 3
    totalIntensity: 30
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic

