- type: entity
  id: WeaponTurretShard
  name: 轻型质量投射炮“碎片”
  parent:
  - BallisticArtillery
  - BallisticArtilleryTier1HP
  description: 超轻型质量驱动武器，来源不明，在最初的逆向工程尝试中被命名为“碎片”。伤害轻，但射程远，安装在船上几乎不需维护。
  suffix: Drone T1
  components:
  - type: StaticPrice
    price: 10000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/shard.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: WirelessNetworkConnection
    range: 500
  - type: Gun
    fireRate: 0.4
    recoil: 10 # 2/5x
    projectileSpeed: 350
    minAngle: 0
    maxAngle: 0
    shootThermalSignature: 300000
    soundGunshot:
      collection: ShipGunMjolnir
    soundEmpty:
      path: /Audio/Weapons/click.ogg
  - type: SpaceArtillery
    powerChargeRate: 1500
    powerUsePassive: 1500
    powerUseActive: 0
  - type: Battery
    maxCharge: 10000
    startingCharge: 10000
  - type: ProjectileBatteryAmmoProvider
    proto: ShipShardProjectile
    fireCost: 1500
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 3000
  - type: ExtensionCableReceiver
  - type: ApcPowerReceiver
    powerLoad: 1500
  - type: Actions
  - type: RadarBlip
    radarColor: "#0080FF"
    scale: 1.5
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Ballistic
  - type: ShipGunClass
    shipClass: Light
  - type: HardpointAnchorableOnly
    class: Ballistic
    size: Light

- type: entity
  id: WeaponTurretFragment
  name: "\"Fragment\" 改良型质量投射炮"
  parent: WeaponTurretShard
  description: 看起来是一个经过重度改造的“碎片”质量投射炮。不稳定，在野外很少见。
  suffix: Drone T2
  components:
  - type: StaticPrice
    price: 20000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/fragment.rsi
  - type: Gun
    fireRate: 1
    recoil: 20 # gooo
    minAngle: 0
    maxAngle: 2
    projectileSpeed: 250 # lower a bit
  - type: GunRandomFirerate
    asTime: false
    # 1/s average
    minMul: 0.05
    maxMul: 5
  - type: SpaceArtillery
    powerChargeRate: 4500
    powerUsePassive: 4500
    powerUseActive: 0
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 6000
  - type: Battery
    maxCharge: 20000
    startingCharge: 20000
  - type: ProjectileBatteryAmmoProvider
    proto: ShipFragmentProjectile
    fireCost: 1000
  - type: RadarBlip
    scale: 2.5
    gridConfig:
      color: "#4080FF"
      shape: Diamond
      respectZoom: true
      rotate: true
      bounds: "-1,-1.5,1,1.5"
  - type: ShipGunClass
    shipClass: Medium
  - type: HardpointAnchorableOnly
    class: Ballistic
    size: Light

- type: entity
  id: WeaponTurretPinhole
  name: 针孔级轨道炮
  parent:
  - BallisticArtillery
  - BallisticArtilleryTier2HP
  description: 来源不明的大规模质量投射武器。逆向工程尝试显示其弹丸速度极高，弹头质量大，但推动飞船的载荷尚未解决。
  suffix: Drone T2
  components:
  - type: StaticPrice
    price: 30000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/pinhole.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: WirelessNetworkConnection
    range: 500
  - type: Gun
    fireRate: 0.1
    recoil: 25 # 1x
    projectileSpeed: 600
    minAngle: 0
    maxAngle: 0
    shootThermalSignature: 1200000
    burstCooldown: 10
    burstFireRate: 2
    shotsPerBurst: 3
    selectedMode: Burst
    availableModes: Burst
    soundGunshot:
      collection: ShipGunMjolnir
    soundEmpty:
      path: /Audio/Weapons/click.ogg
  - type: SpaceArtillery
    powerChargeRate: 5000
    powerUsePassive: 5000
  - type: Battery
    maxCharge: 20000
    startingCharge: 20000
  - type: ProjectileBatteryAmmoProvider
    proto: ShipPinholeProjectile
    fireCost: 5000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 8000
  - type: Actions
  - type: RadarBlip
    radarColor: "#4080FF"
    scale: 2.5
    gridConfig:
      color: "#4080FF"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-1,-1.5,1,1.5"
  - type: ShipGunType
    shipType: Ballistic
  - type: ShipGunClass
    shipClass: Medium
  - type: HardpointAnchorableOnly
    class: Ballistic
    size: Heavy
