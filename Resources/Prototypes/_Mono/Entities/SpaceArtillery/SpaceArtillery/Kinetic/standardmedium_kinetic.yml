# AK570

- type: entity
  id: WeaponTurretAK570
  name: AK570 57mm 自动加农炮
  parent:
  - BallisticArtilleryMagazine
  - BallisticArtilleryTier2HP
  suffix: Medium, T2
  description: 一门双管、重型57毫米自动炮，发射通用穿甲高爆弹，对中型目标进行持续射击很有效。可以远程激活或连接到地面控制站(GCS)。
  components:
  - type: StaticPrice
    price: 650
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/artillery.rsi
    layers:
    - state: space_artillery
    - state: fcs-unshaded
      shader: unshaded
    scale: 1, 1
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: AutoShootGun
  - type: GunSignalControl
  - type: WirelessNetworkConnection
    range: 500
  - type: Gun
    damageModifier: 1.1
    fireRate: 3
    recoil: 10 # 2/5x
    projectileSpeed: 320
    minAngle: 0
    maxAngle: 3
    burstCooldown: 0.6
    burstFireRate: 10
    shotsPerBurst: 2
    selectedMode: Burst
    availableModes: Burst
    shootThermalSignature: 2000000 # ~4.5km signature if firing continuously
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/120mm_mortar.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 125
  - type: SpaceArtillery
    powerChargeRate: 125
    powerUsePassive: 600
    powerUseActive: 0
  - type: Actions
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine57mmHE
        insertSound: /Audio/Weapons/Guns/MagIn/hpistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine57mm
        whitelistFailPopup: gun-magazine-whitelist-fail
  - type: RadarBlip
    radarColor: "#FF0000"
    scale: 1.5
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Ballistic
  - type: ShipGunClass
    shipClass: Medium
  - type: ShipRepairable
    repairTime: 15
    repairCost: 60
  - type: HardpointAnchorableOnly
    class: Ballistic
    size: Light

# Dravon

- type: entity
