  - BallisticArtilleryMagazine
  - BallisticArtilleryTier2HP
  suffix: Medium, T2
  description: 由艾瑟利恩动力制造的单管自动加农炮。中型火炮，威力高但射速相对较低，发射高爆反坦克弹以损毁舰船装甲和系统。可以远程激活，也可以连接到GCS。
  components:
  - type: StaticPrice
    price: 900
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/dravon.rsi
    layers:
