- type: entity
  id: WeaponTurretCharonBase
  parent: BallisticArtilleryTier4HP
  name: 'M381 卡戎质量投射器'
  suffix: Capital, T4
  abstract: true
  components:
  - type: StaticPrice
    price: 30000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/charon.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: WirelessNetworkConnection
    range: 500
  - type: GunSignalControl
  - type: Gun
    fireRate: 0.05
    recoil: 2500 # 100x
    minAngle: 0
    maxAngle: 0
    projectileSpeed: 700 # projectiles cannot go faster than this
    shootThermalSignature: 18000000 # ~8.5km after firing
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/leviathan_fire.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: SpaceArtillery
    powerChargeRate: 350
    powerUsePassive: 1000
    powerUseActive: 7500
  - type: Actions
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: RadarBlip
    radarColor: "#CF0E0E"
    scale: 3
    visibleFromOtherGrids: true
    gridConfig:
      color: "#CF0E0E"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-1.5,-2.5,1.5,2.5"
  - type: ShipGunType
    shipType: Ballistic
  - type: ShipGunClass
    shipClass: Superheavy
  - type: ShipRepairable
    repairTime: 45
    repairCost: 300

# Station one w/ infinite ammo

- type: entity
  id: WeaponTurretCharon
  name: M381 卡戎质量加速器
  parent: [WeaponTurretCharonBase, BallisticArtilleryUnanchorable]
  suffix: Station, Recharging Ammo
  description: 一门首都级轨道炮，可以以极高速度发射巨大的弹丸，对敌舰造成灾难性伤害。重型线性加速器，可以远程启动或连接到GCS。这门炮采用某种自动装弹装置供弹，不需要人工装填。
  components:
  - type: Battery
    maxCharge: 40000
    startingCharge: 40000
  - type: ExaminableBattery
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 350
  - type: ProjectileBatteryAmmoProvider
    proto: ShipRailgunProjectile
    fireCost: 1500

# Ship one w/ limited ammo

- type: entity
  id: WeaponTurretCharonReload
  name: 'M381 卡戎质量加速器'
  parent: [WeaponTurretCharonBase, BallisticArtilleryUnanchorableCartridge]
  suffix: Spinal, T4
  description: 一种首都级轨道炮，发射高速巨弹，能对敌方舰船造成灾难性破坏。重型线性加速器，可以远程启动或连接到地面控制系统。
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CharonSlug
    capacity: 1
    proto: CharonSlugAmmo
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
