# inf ammo for ads/station

- type: entity
  id: WeaponTurretTarnyx
  name: 'ADBX-31泰尼克斯150mm 电磁脉冲炮'
  parent:
  - BallisticArtilleryUnanchorable
  - BallisticArtilleryTier3HP
  suffix: Station, Recharging Ammo, EMP
  description: '由以太动力制造的重型电磁脉冲炮，能够通过单次强力射击瘫痪敌舰的大片区域。在不对称作战中效果显著。支持远程激活或连接至全局作战系统。 | A heavy EMP cannon made by Aetherion Dynamics, designed to disable large sections of enemy ships with a single, powerful shot. Effective in asymmetric combat. Can be remotely activated or linked up to a GCS.'
  components:
  - type: StaticPrice
    price: 10000
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/tarnyx.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AmmoCounter
  - type: Battery
    maxCharge: 40000
    startingCharge: 40000
  - type: ExaminableBattery
  - type: WirelessNetworkConnection
    range: 500
  - type: GunSignalControl
  - type: Gun
    fireRate: 0.066
    projectileSpeed: 400
    shootThermalSignature: 8000000 # ~2.8km after firing - relatively low
    soundGunshot:
      collection: ShipGunGenericBig
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 214
  - type: SpaceArtillery
    powerChargeRate: 214
    powerUsePassive: 3500
    powerUseActive: 0
  - type: Actions
  - type: ProjectileBatteryAmmoProvider
    proto: ShipTarnyxProjectile
    fireCost: 150
  - type: RadarBlip
    radarColor: "#035EFC"
    scale: 2.5
    visibleFromOtherGrids: true
  - type: ShipGunType
    shipType: Energy
  - type: ShipGunClass
    shipClass: Heavy
  - type: ShipRepairable
    repairTime: 30
    repairCost: 100

