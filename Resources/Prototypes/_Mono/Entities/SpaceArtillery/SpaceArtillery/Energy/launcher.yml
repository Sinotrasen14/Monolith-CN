    powerChargeRate: 81600
    powerUsePassive: 25000
    powerUseActive: 0
  - type: Actions
  - type: ProjectileBatteryAmmoProvider
    proto: ShipGlassingBeamPlasmaProjectile
    fireCost: 300
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 70000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: RadarBlip
    radarColor: "#C92BCC"
    scale: 3
  - type: ShipGunType
    shipType: Energy
  - type: ShipGunClass
    shipClass: Superheavy

