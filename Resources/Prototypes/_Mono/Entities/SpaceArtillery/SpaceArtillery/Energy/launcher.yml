# T241 plasma lance

- type: entity
  id: WeaponTurretType241
  name: 'Type-241 等离子光矛'
  parent: BallisticArtilleryUnanchorable
  suffix: TSF ONLY, ADS ONLY
  description: '毁灭性武器，通常用于大规模火力支援与战略摧毁。 | A devastating weapon, usually used for large scale fire support and strategic destruction.'
