    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.75,-0.75,0.75,0.75"
        density: 1500
  - type: Gun
    projectileSpeed: 70
    fireRate: 13
    minAngle: 0
    maxAngle: 0
    burstCooldown: 60
    burstFireRate: 13
    shotsPerBurst: 136
    selectedMode: Burst
    availableModes: Burst
    shootThermalSignature: 2000000 # ~10km while firing
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/glassing.ogg
