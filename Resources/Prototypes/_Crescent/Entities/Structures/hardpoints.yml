- type: entity
  id: BaseHardpoint
  name: 挂载点
  abstract: true
  description: 船用武器可以连接到船上各种系统的一个点，比如气动弹药装填器或火控系统。
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Crescent/Structures/hardpoints.rsi
    state: medium
    drawdepth: HighFloorObjects
  - type: ExaminableDamage
    messages: WindowMessages
  - type: Physics
    bodyType: Static
    canCollide: False
  - type: GravityAffected
  - type: InteractionOutline
  - type: Clickable
  - type: Transform
    noRot: false
    anchored: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: RequiresGrid # Mono
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Repairable
    doAfterDelay: 8
    qualities:
    - Applicating
  - type: Appearance
  - type: Hardpoint
    class: Ballistic
    size: Medium
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        # very not dense to make it easy to pull
        density: 600
        mask:
        - SmallMobMask
        layer:
        - MachineLayer
  - type: CollideOnAnchor
  - type: ShipRepairable
    repairTime: 15
    repairCost: 50 # Main cost is in the guns.
  - type: Pullable
  - type: Tag
    tags:
    - Structure

- type: entity
  id: HardpointDebugSuperlight
  parent: BaseHardpoint
  name: 调试挂载点超轻通用
  suffix: DO NOT MAP
  components:
  - type: Hardpoint
    class: Universal
    size: Superlight
  - type: ApcPowerReceiver
    powerLoad: 10000
  - type: Sprite
    sprite: _Crescent/Structures/hardpoints.rsi
    state: medium
  - type: ShipRepairable
    repairTime: 1
    repairCost: 0

